spring:
  config:
    # Database type selector: datasource-mysql.yml or datasource-h2.yml.
    import: datasource-mysql.yml
  application:
    name: chatchat
    version: 1.0.0-SNAPSHOT
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    static-path-pattern: /**
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: 1800000
  resources:
    add-mappings: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB

server:
  port: 8080
  tomcat:
    connection-timeout: 30m
    keep-alive-timeout: 30m
    max-http-form-post-size: 33554432
    max-swallow-size: -1
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful

chatchat:
  chat:
    detail-store:
      type: rocksdb
      path: ./data/chat-rocksdb
      create-if-missing: true
      max-string-length: 100000000
      external-text:
        enabled: true
        index-name: chatchat_chat_details
        migrate-legacy-on-read: true
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret:
    secret: chatchat_internal_default_secret
    crypto-key:
    crypto-key-file:
  mcp:
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    center:
      enabled: true
      base-url: http://localhost:8090
      admin-username: chatchat_mcp_internal
      encrypted-admin-password:
      admin-password: chatchat_internal_default_secret
      encrypted-invocation-token:
      invocation-token: chatchat_internal_default_secret
      timeout-ms: 1800000
      import-standalone-server: true
      auto-recovery-enabled: true
      heartbeat-initial-delay-ms: 10000
      heartbeat-interval-ms: 15000
      heartbeat-timeout-ms: 5000
      max-auto-sync-attempts: 5
    stdio-proxy:
      enabled: true
      command-allow-list:
        - npx
        - node
        - uvx
        - python
        - python3
  models:
    defaultProvider: openai
    defaultChatModel: deepseek-v4-pro
    context-window-max-tokens: 200000
    context-reserved-system-tokens: 20000
    context-reserved-history-tokens: 30000
    context-reserved-output-tokens: 30000
    availableChatModels:
      - deepseek-v4-pro
    openai:
      apiKey: sk-dfa0ad97eba946b6b5ba6041a04e833d
      baseUrl: https://api.deepseek.com
      timeout: 1800000
      maxTokens: -1
      maxRetries: 3
  agent:
    task:
      queue-capacity: 1000
      core-pool-size: 16
      max-pool-size: 16
      max-concurrent-tasks-per-tenant: 4
      execution-timeout-ms: 3600000
  tool-runtime:
    default-tool-timeout-ms: 1800000
    max-batch-calls: 32
    max-batch-payload-bytes: 262144
  agent-runtime:
    final-summary-web-search-enabled: true
    final-summary-web-search-max-keywords: 2
    final-summary-web-search-result-limit: 6
    final-summary-web-search-evidence-max-chars: 16000
    final-summary-web-search-timeout-ms: 120000
  search:
    engine: opensearch
    store-path: ./data/search-rocksdb
    file-path: ./data/search-files
    rebuild-on-startup: false
    opensearch:
      enabled: true
      url: https://192.168.195.221:9200
      username: admin
      password: apexSoft12345
      index-name: chatchat_documents_dev
      insecure-ssl: true
      connect-timeout-ms: 5000
      request-timeout-ms: 30000
      bulk-batch-size: 200
      max-query-terms: 20
      max-query-chars: 500
      max-permission-roles: 64
      log-query-dsl: true
      embedding:
        request-timeout-ms: 300000
        enabled: true
        endpoint: https://tokenhub.tencentmaas.com/v1/embeddings
        api-key: sk-e9xW4FEk6ONVAy50XyQunS7A6dmE1a9X1errk7LW7yShFcvL
        model: kinfra-text-embedding-4b
        dimension: 1024
        vector-field: contentVector
        max-input-chars: 6000
        vector-candidate-limit: 50
  tools:
    document-search:
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        password: chatchat_internal_default_secret

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: false

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: logs/chatchat.log
  level:
    com.chatchat: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
