spring:
  application:
    name: chatchat
    version: 1.0.0-SNAPSHOT
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: "jdbc:h2:file:./data/h2/chatchat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    static-path-pattern: /**
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: 1800000
  resources:
    add-mappings: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  tomcat:
    connection-timeout: 30m
    keep-alive-timeout: 30m
    max-http-form-post-size: 33554432
    max-swallow-size: -1
  error:
    include-stacktrace: never
    include-message: never

chatchat:
  chat:
    detail-store:
      type: rocksdb
      path: ./data/chat-rocksdb
      create-if-missing: true
      max-string-length: 100000000
      external-text:
        enabled: true
        index-name: chatchat_chat_details
        migrate-legacy-on-read: true
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret:
    secret: chatchat_internal_default_secret
    crypto-key:
    crypto-key-file:
  mcp:
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    center:
      enabled: true
      base-url: http://localhost:8090
      admin-username: chatchat_mcp_internal
      encrypted-admin-password:
      admin-password: chatchat_internal_default_secret
      encrypted-invocation-token:
      invocation-token: chatchat_internal_default_secret
      timeout-ms: 1800000
      import-standalone-server: true
      auto-recovery-enabled: true
      heartbeat-initial-delay-ms: 10000
      heartbeat-interval-ms: 15000
      heartbeat-timeout-ms: 5000
      max-auto-sync-attempts: 5
    stdio-proxy:
      enabled: true
      command-allow-list:
        - npx
        - node
        - uvx
        - python
        - python3
  models:
    defaultProvider: openai
    defaultChatModel: deepseek-v4-pro
    context-window-max-tokens: 200000
    context-reserved-system-tokens: 20000
    context-reserved-history-tokens: 30000
    context-reserved-output-tokens: 30000
    availableChatModels:
      - deepseek-v4-pro
    openai:
      apiKey:
      baseUrl: https://api.openai.com/v1
      timeout: 1800000
      maxTokens: -1
      maxRetries: 3
  agent:
    task:
      queue-capacity: 1000
      core-pool-size: 16
      max-pool-size: 16
      max-concurrent-tasks-per-tenant: 4
      execution-timeout-ms: 3600000
  tool-runtime:
    default-tool-timeout-ms: 1800000
    max-batch-calls: 32
    max-batch-payload-bytes: 262144
  agent-runtime:
    final-summary-web-search-enabled: true
    final-summary-web-search-max-keywords: 2
    final-summary-web-search-result-limit: 6
    final-summary-web-search-evidence-max-chars: 16000
    final-summary-web-search-timeout-ms: 120000
  search:
    engine: lucene
  tools:
    document-search:
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        password: chatchat_internal_default_secret

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: false

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: logs/chatchat.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 14
      total-size-cap: 2GB
      clean-history-on-start: true
  level:
    com.chatchat: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
