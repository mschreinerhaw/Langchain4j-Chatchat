spring:
  config:
    # Database type selector: datasource-mysql.yml or datasource-h2.yml.
    import: datasource-h2.yml
  application:
    name: chatchat
    version: 1.0.0-SNAPSHOT
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    static-path-pattern: /**
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: 1800000
  resources:
    add-mappings: false
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 60MB

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  tomcat:
    connection-timeout: 30m
    keep-alive-timeout: 30m
    max-http-form-post-size: 33554432
    max-swallow-size: -1
  error:
    include-stacktrace: never
    include-message: never

chatchat:
  http:
    json-request:
      enabled: ${CHATCHAT_JSON_REQUEST_LIMIT_ENABLED:true}
      max-bytes: ${CHATCHAT_JSON_REQUEST_MAX_BYTES:2097152}
      warning-bytes: ${CHATCHAT_JSON_REQUEST_WARNING_BYTES:524288}
  chat:
    detail-store:
      type: rocksdb
      path: ./data/chat-rocksdb
      create-if-missing: true
      max-string-length: 100000000
      external-text:
        enabled: true
        index-name: chatchat_chat_details
        migrate-legacy-on-read: true
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: "ENC(RJGDk0FA9Xht7fHK:VBpgvsk5UR2XGCoSxNL7eqlS0Lu4r2UG1U6vvQ6NM7KBEwQ6/5j09M/A+mdijO9H)"
    crypto-key-file: ./config/internal-credential.key
  mcp:
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    center:
      enabled: true
      base-url: http://localhost:8090
      admin-username: chatchat_mcp_internal
      encrypted-admin-password: "${CHATCHAT_API_MCP_ENCRYPTED_PASSWORD:${chatchat.internal-credential.encrypted-secret:}}"
      encrypted-invocation-token: "${CHATCHAT_API_MCP_ENCRYPTED_INVOCATION_TOKEN:${chatchat.internal-credential.encrypted-secret:}}"
      timeout-ms: 1800000
      import-standalone-server: true
      auto-recovery-enabled: true
      heartbeat-initial-delay-ms: 10000
      heartbeat-interval-ms: 15000
      heartbeat-timeout-ms: 5000
      max-auto-sync-attempts: 5
    stdio-proxy:
      enabled: true
      command-allow-list:
        - npx
        - node
        - uvx
        - python
        - python3
  models:
    defaultChatModel: deepseek-v4-pro
    context-window-max-tokens: 200000
    context-reserved-system-tokens: 20000
    context-reserved-history-tokens: 30000
    context-reserved-output-tokens: 30000
    availableChatModels:
      - deepseek-v4-pro
    chatModels:
      deepseek-v4-pro:
        apiKey:
        baseUrl: https://api.openai.com/v1
        protocol: auto
        timeout: 1800000
        maxTokens: -1
        maxRetries: 3
  agent:
    task:
      queue-capacity: 1000
      core-pool-size: 16
      max-pool-size: 16
      max-concurrent-tasks-per-tenant: 4
      execution-timeout-ms: 3600000
      database-queue-enabled: ${CHATCHAT_AGENT_DATABASE_QUEUE_ENABLED:true}
      database-queue-poll-ms: ${CHATCHAT_AGENT_DATABASE_QUEUE_POLL_MS:250}
      database-quota-reconcile-ms: ${CHATCHAT_AGENT_DATABASE_QUOTA_RECONCILE_MS:30000}
      database-queue-claim-batch-size: ${CHATCHAT_AGENT_DATABASE_QUEUE_CLAIM_BATCH_SIZE:16}
      worker-lease-ms: ${CHATCHAT_AGENT_WORKER_LEASE_MS:30000}
      worker-heartbeat-ms: ${CHATCHAT_AGENT_WORKER_HEARTBEAT_MS:10000}
      task-max-attempts: ${CHATCHAT_AGENT_TASK_MAX_ATTEMPTS:3}
      retry-base-delay-ms: ${CHATCHAT_AGENT_RETRY_BASE_DELAY_MS:1000}
      retry-max-delay-ms: ${CHATCHAT_AGENT_RETRY_MAX_DELAY_MS:60000}
      worker-version: ${CHATCHAT_AGENT_WORKER_VERSION:1.0}
      worker-capabilities: ${CHATCHAT_AGENT_WORKER_CAPABILITIES:dag-v2,conditional-edge-v1}
  tool-runtime:
    default-max-calls-per-second: ${CHATCHAT_TOOL_DEFAULT_QPS:10}
    default-tool-timeout-ms: 1800000
    max-batch-calls: 32
    max-batch-payload-bytes: 262144
    max-output-bytes: ${CHATCHAT_TOOL_MAX_OUTPUT_BYTES:262144}
    max-output-preview-chars: ${CHATCHAT_TOOL_MAX_OUTPUT_PREVIEW_CHARS:16000}
  agent-runtime:
    max-concurrent-per-tenant: ${CHATCHAT_AGENT_MAX_CONCURRENT_PER_TENANT:4}
    max-queued-per-tenant: ${CHATCHAT_AGENT_MAX_QUEUED_PER_TENANT:50}
    tenant-fair-scheduling-enabled: true
    lease-recovery-scan-ms: ${CHATCHAT_AGENT_LEASE_RECOVERY_SCAN_MS:5000}
    final-summary-web-search-enabled: true
    final-summary-web-search-max-keywords: 2
    final-summary-web-search-result-limit: 6
    final-summary-web-search-evidence-max-chars: 16000
    final-summary-web-search-timeout-ms: 45000
    answer-quality-pipeline-enabled: true
    answer-critic-enabled: true
    answer-repair-enabled: true
    answer-critic-timeout-ms: 45000
    # Lossless processing boundaries; these values never truncate returned evidence.
    record-analysis-chunk-max-chars: ${CHATCHAT_AGENT_RECORD_ANALYSIS_CHUNK_MAX_CHARS:12000}
    record-analysis-chunk-max-rows: ${CHATCHAT_AGENT_RECORD_ANALYSIS_CHUNK_MAX_ROWS:50}
    analysis-spill-enabled: ${CHATCHAT_AGENT_ANALYSIS_SPILL_ENABLED:true}
    analysis-spill-rocks-db-path: ${CHATCHAT_AGENT_ANALYSIS_SPILL_ROCKSDB_PATH:./data/agent-analysis-spill-rocksdb}
    analysis-spill-rocks-db-create-if-missing: true
    analysis-spill-threshold-bytes: ${CHATCHAT_AGENT_ANALYSIS_SPILL_THRESHOLD_BYTES:65536}
    analysis-spill-ttl-ms: ${CHATCHAT_AGENT_ANALYSIS_SPILL_TTL_MS:604800000}
  search:
    engine: lucene
    max-upload-bytes: ${CHATCHAT_SEARCH_MAX_UPLOAD_BYTES:57671680}
    upload-chunk-bytes: ${CHATCHAT_SEARCH_UPLOAD_CHUNK_BYTES:5242880}
  tools:
    document-search:
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password: "${CHATCHAT_MCP_API_ENCRYPTED_PASSWORD:${chatchat.internal-credential.encrypted-secret:}}"

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: false

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: logs/chatchat.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 14
      total-size-cap: 2GB
      clean-history-on-start: true
  level:
    com.chatchat: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
