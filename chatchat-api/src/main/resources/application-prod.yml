spring:
  config:
    # Set CHATCHAT_DATASOURCE_CONFIG to datasource-mysql.yml or datasource-postgresql.yml.
    import: ${CHATCHAT_DATASOURCE_CONFIG:datasource-h2.yml}
  application:
    name: chatchat
    version: 1.0.0-SNAPSHOT
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    static-path-pattern: /**
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: 1800000
  resources:
    add-mappings: false
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 60MB

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  tomcat:
    connection-timeout: 30m
    keep-alive-timeout: 30m
    max-http-form-post-size: 33554432
    max-swallow-size: -1
  error:
    include-stacktrace: never
    include-message: never

chatchat:
  document:
    gateway:
      enabled: ${CHATCHAT_DOCUMENT_GATEWAY_ENABLED:false}
  knowledge:
    runtime:
      skill-timeout-ms: 15000
      total-timeout-ms: 18000
      max-concurrency: 8
      queue-capacity: 64
  data-science:
    workspace-root: ./data/python-assets
    max-data-file-bytes: 52428800
    data-cleanup-interval-ms: 3600000
    docker-command: docker
    default-image: python:3.12-slim
    cpu-limit: 2
    memory-limit: 4g
    timeout-seconds: 300
    output-limit-bytes: 1000000
    index-name: mcp_python_template_index
  skills:
    domain:
      index-name: domain_skill_index
    federation:
      credential-key: ${CHATCHAT_SKILL_FEDERATION_CREDENTIAL_KEY:}
      max-skills-per-source: ${CHATCHAT_SKILL_FEDERATION_MAX_SKILLS:1000}
      page-size: ${CHATCHAT_SKILL_FEDERATION_PAGE_SIZE:100}
      max-skill-bytes: ${CHATCHAT_SKILL_FEDERATION_MAX_SKILL_BYTES:1048576}
  domain-skills:
    compiler-model: ${CHATCHAT_DOMAIN_SKILL_COMPILER_MODEL:deepseek-v4-pro}
    router-model: ${CHATCHAT_DOMAIN_SKILL_ROUTER_MODEL:${CHATCHAT_DOMAIN_SKILL_COMPILER_MODEL:deepseek-v4-pro}}
    max-activated-skills: ${CHATCHAT_DOMAIN_SKILL_MAX_ACTIVATED:4}
    router-input-chars: ${CHATCHAT_DOMAIN_SKILL_ROUTER_INPUT_CHARS:49152}
    planning-token-budget: ${CHATCHAT_DOMAIN_SKILL_PLANNING_TOKEN_BUDGET:6000}
  audit:
    default-query-window-days: 7
  ui-artifact:
    enabled: true
    # local and shared both use Java NIO. For shared mode, storage-path must be an OS-mounted NFSv4/SMB3/CephFS path.
    store-type: local
    storage-path: ./data/ui-artifacts
    shared-marker-file: .chatchat-artifact-store
    migrate-legacy-on-read: true
    # Render every non-empty UI response through the governed artifact renderer by default.
    always-externalize: true
    # Used only when always-externalize is false.
    externalize-threshold-bytes: 131072
    answer-preview-characters: 20000
    ttl-seconds: 2592000
    cleanup-interval-ms: 3600000
  http:
    json-request:
      enabled: true
      max-bytes: 2097152
      warning-bytes: 524288
  chat:
    detail-store:
      type: rocksdb
      path: ./data/chat-rocksdb
      create-if-missing: true
      max-string-length: 100000000
      external-text:
        enabled: true
        index-name: chatchat_chat_details
        migrate-legacy-on-read: true
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: "ENC(dt5Pfih5uB3eHVuG:H+kw3gs+C6vYEB6mKEHMOV9ayhJl0Udwhzyh0T2b2ULxNJ9xzPraje8HDDoXXjbHggxcJiZ4McExLoV0)"
    crypto-key-file: ./config/internal-credential.key
  mcp:
    capability-retrieval:
      enabled: ${CHATCHAT_MCP_CAPABILITY_RETRIEVAL_ENABLED:true}
    remote-provider:
      enabled: true
    grpc:
      client:
        enabled: true
        host: ${CHATCHAT_MCP_GRPC_HOST:localhost}
        port: ${CHATCHAT_MCP_GRPC_PORT:9091}
        plaintext: ${CHATCHAT_MCP_GRPC_PLAINTEXT:true}
        trust-certificate-path: 
        deadline-ms: 1800000
        max-inbound-message-bytes: 4194304
        max-response-bytes: 536870912
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    center:
      enabled: true
      base-url: http://localhost:8090
      admin-username: chatchat_mcp_internal
      encrypted-admin-password: "ENC(dt5Pfih5uB3eHVuG:H+kw3gs+C6vYEB6mKEHMOV9ayhJl0Udwhzyh0T2b2ULxNJ9xzPraje8HDDoXXjbHggxcJiZ4McExLoV0)"
      encrypted-invocation-token: "ENC(dt5Pfih5uB3eHVuG:H+kw3gs+C6vYEB6mKEHMOV9ayhJl0Udwhzyh0T2b2ULxNJ9xzPraje8HDDoXXjbHggxcJiZ4McExLoV0)"
      timeout-ms: 1800000
      import-standalone-server: true
      auto-recovery-enabled: true
      heartbeat-initial-delay-ms: 10000
      heartbeat-interval-ms: 60000
      heartbeat-timeout-ms: 15000
      max-auto-sync-attempts: 5
    stdio-proxy:
      enabled: true
      command-allow-list:
        - npx
        - node
        - uvx
        - python
        - python3
  models:
    defaultChatModel: deepseek-v4-pro
    context-window-max-tokens: 200000
    context-reserved-system-tokens: 20000
    context-reserved-history-tokens: 30000
    context-reserved-output-tokens: 30000
    availableChatModels:
      - deepseek-v4-pro
    chatModels:
      deepseek-v4-pro:
        apiKey:
        baseUrl: https://api.openai.com/v1
        protocol: auto
        timeout: 1800000
        maxTokens: -1
        maxRetries: 3
  agent:
    task:
      queue-capacity: 1000
      core-pool-size: 16
      max-pool-size: 16
      max-concurrent-tasks-per-tenant: 4
      execution-timeout-ms: 0
      database-queue-enabled: true
      database-queue-poll-ms: 250
      database-quota-reconcile-ms: 30000
      database-queue-claim-batch-size: 16
      worker-lease-ms: 120000
      worker-heartbeat-ms: 10000
      task-max-attempts: 3
      retry-base-delay-ms: 1000
      retry-max-delay-ms: 60000
      worker-version: 1.0
      worker-capabilities: dag-v2,conditional-edge-v1
      event-store:
        type: database
  tool-runtime:
    default-max-calls-per-second: 10
    default-tool-timeout-ms: 1800000
    max-batch-calls: 32
    max-batch-payload-bytes: 262144
    max-output-bytes: 262144
    max-output-preview-chars: 16000
  agent-runtime:
    workflow-engine: local
    native-tool-calling-enabled: true
    temporal:
      target: 127.0.0.1:7233
      namespace: default
      task-queue: chatchat-agent-runtime
      activity-start-to-close-seconds: 86400
      activity-heartbeat-seconds: 5
      activity-maximum-attempts: 1
    store-type: database
    model-token-budget: 0
    model-cost-budget: 0
    model-input-cost-per-thousand-tokens: 0
    model-output-cost-per-thousand-tokens: 0
    budget-alert-ratio: 0.8
    model-max-concurrent-per-model: 8
    model-max-requests-per-second: 10
    model-capacity-acquire-timeout-ms: 30000
    max-concurrent-per-tenant: 4
    max-queued-per-tenant: 50
    tenant-fair-scheduling-enabled: true
    lease-recovery-scan-ms: 5000
    final-summary-web-search-enabled: true
    final-summary-web-search-max-keywords: 2
    final-summary-web-search-result-limit: 6
    final-summary-web-search-evidence-max-chars: 16000
    final-summary-web-search-timeout-ms: 45000
    answer-quality-pipeline-enabled: true
    answer-critic-enabled: true
    answer-repair-enabled: true
    answer-critic-timeout-ms: 45000
    # Lossless processing boundaries; these values never truncate returned evidence.
    record-analysis-chunk-max-chars: 12000
    record-analysis-chunk-max-rows: 50
    analysis-summary-worker-count: 4
    analysis-per-dataset-worker-threshold: 3
    analysis-per-dataset-worker-total-chars-threshold: 24000
    analysis-summary-worker-max-retries: 3
    # Worker completion has no independent wall-clock timeout. Model calls use the configured
    # system model/request timeout; these values govern Worker liveness only.
    analysis-summary-worker-heartbeat-interval-ms: 10000
    analysis-summary-worker-heartbeat-timeout-ms: 30000
    analysis-spill-enabled: true
    analysis-spill-rocks-db-path: ./data/agent-analysis-spill-rocksdb
    analysis-spill-rocks-db-create-if-missing: true
    analysis-spill-threshold-bytes: 65536
    analysis-spill-ttl-ms: 604800000
  search:
    engine: ${CHATCHAT_SEARCH_ENGINE:opensearch}
    document-first-enabled: true
    problem-analysis:
      routing-min-documents: 3
      routing-max-documents: 10
      fusion-candidate-limit: 30
      final-evidence-limit: 5
      parent-section-limit-per-document: 20
      bge-reranker:
        enabled: ${CHATCHAT_BGE_RERANKER_ENABLED:false}
        endpoint: ${CHATCHAT_BGE_RERANKER_ENDPOINT:}
        api-key: ${CHATCHAT_BGE_RERANKER_API_KEY:}
        model: ${CHATCHAT_BGE_RERANKER_MODEL:BAAI/bge-reranker-v2-m3}
        request-timeout-ms: 30000
        max-document-chars: 6000
    max-upload-bytes: 57671680
    upload-chunk-bytes: 5242880
    opensearch:
      enabled: ${CHATCHAT_SEARCH_OPENSEARCH_ENABLED:true}
      url: ${CHATCHAT_SEARCH_OPENSEARCH_URL:http://localhost:9200}
      username: ${CHATCHAT_SEARCH_OPENSEARCH_USERNAME:}
      password: ${CHATCHAT_SEARCH_OPENSEARCH_PASSWORD:}
      index-name: ${CHATCHAT_SEARCH_OPENSEARCH_INDEX:chatchat_documents}
      insecure-ssl: ${CHATCHAT_SEARCH_OPENSEARCH_INSECURE_SSL:false}
      embedding:
        enabled: ${CHATCHAT_SEARCH_EMBEDDING_ENABLED:false}
        endpoint: ${CHATCHAT_SEARCH_EMBEDDING_ENDPOINT:}
        api-key: ${CHATCHAT_SEARCH_EMBEDDING_API_KEY:}
        model: ${CHATCHAT_SEARCH_EMBEDDING_MODEL:}
        dimension: ${CHATCHAT_SEARCH_EMBEDDING_DIMENSION:1024}
        vector-field: contentVector
        vector-candidate-limit: 30
  tools:
    document-search:
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password: "ENC(dt5Pfih5uB3eHVuG:H+kw3gs+C6vYEB6mKEHMOV9ayhJl0Udwhzyh0T2b2ULxNJ9xzPraje8HDDoXXjbHggxcJiZ4McExLoV0)"

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: false

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: logs/chatchat.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 14
      total-size-cap: 2GB
      clean-history-on-start: true
  level:
    com.chatchat: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
