spring:
  application:
    name: chatchat
    version: 1.0.0-SNAPSHOT
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: "jdbc:h2:file:./data/h2/chatchat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    static-path-pattern: /**
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: ${SPRING_MVC_ASYNC_TIMEOUT_MS:1800000}
  resources:
    add-mappings: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB

server:
  port: ${CHATCHAT_API_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:30m}
    keep-alive-timeout: ${SERVER_KEEP_ALIVE_TIMEOUT:30m}
    max-http-form-post-size: 33554432
    max-swallow-size: -1
  error:
    include-stacktrace: never
    include-message: never

chatchat:
  chat:
    detail-store:
      type: rocksdb
      path: ./data/chat-rocksdb
      create-if-missing: true
      max-string-length: 100000000
      external-text:
        enabled: true
        index-name: chatchat_chat_details
        migrate-legacy-on-read: true
  internal-credential:
    enabled: true
    username: ${CHATCHAT_INTERNAL_USERNAME:chatchat_mcp_internal}
    encrypted-secret: ${CHATCHAT_INTERNAL_ENCRYPTED_SECRET:}
    secret: ${CHATCHAT_INTERNAL_SECRET:chatchat_internal_default_secret}
    crypto-key: ${CHATCHAT_INTERNAL_CRYPTO_KEY:}
    crypto-key-file: ${CHATCHAT_INTERNAL_CRYPTO_KEY_FILE:}
  mcp:
    capabilities:
      news:
        enabled: ${CHATCHAT_NEWS_CAPABILITY_ENABLED:true}
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    center:
      enabled: true
      base-url: ${CHATCHAT_MCP_CENTER_BASE_URL:http://localhost:8090}
      admin-username: ${CHATCHAT_INTERNAL_USERNAME:chatchat_mcp_internal}
      encrypted-admin-password: ${CHATCHAT_INTERNAL_ENCRYPTED_SECRET:}
      admin-password: ${CHATCHAT_INTERNAL_SECRET:chatchat_internal_default_secret}
      encrypted-invocation-token: ${CHATCHAT_INTERNAL_ENCRYPTED_SECRET:}
      invocation-token: ${CHATCHAT_INTERNAL_SECRET:chatchat_internal_default_secret}
      timeout-ms: ${CHATCHAT_MCP_TIMEOUT_MS:1800000}
      import-standalone-server: true
    stdio-proxy:
      enabled: true
      command-allow-list:
        - npx
        - node
        - uvx
        - python
        - python3
  models:
    defaultProvider: openai
    defaultChatModel: ${CHATCHAT_DEFAULT_CHAT_MODEL:deepseek-v4-pro}
    context-window-max-tokens: ${CHATCHAT_MODEL_CONTEXT_WINDOW_MAX_TOKENS:200000}
    context-reserved-system-tokens: ${CHATCHAT_MODEL_CONTEXT_RESERVED_SYSTEM_TOKENS:20000}
    context-reserved-history-tokens: ${CHATCHAT_MODEL_CONTEXT_RESERVED_HISTORY_TOKENS:30000}
    context-reserved-output-tokens: ${CHATCHAT_MODEL_CONTEXT_RESERVED_OUTPUT_TOKENS:30000}
    availableChatModels:
      - ${CHATCHAT_DEFAULT_CHAT_MODEL:deepseek-v4-pro}
    openai:
      apiKey: ${OPENAI_API_KEY:${DASHSCOPE_API_KEY:}}
      baseUrl: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout: ${OPENAI_TIMEOUT_MS:1800000}
      maxTokens: ${OPENAI_MAX_TOKENS:-1}
      maxRetries: ${OPENAI_MAX_RETRIES:3}
  agent:
    task:
      queue-capacity: ${CHATCHAT_AGENT_TASK_QUEUE_CAPACITY:1000}
      core-pool-size: ${CHATCHAT_AGENT_TASK_CORE_POOL_SIZE:16}
      max-pool-size: ${CHATCHAT_AGENT_TASK_MAX_POOL_SIZE:16}
      max-concurrent-tasks-per-tenant: ${CHATCHAT_AGENT_TASK_TENANT_CONCURRENCY:4}
      execution-timeout-ms: ${CHATCHAT_AGENT_TASK_TIMEOUT_MS:3600000}
  tool-runtime:
    default-tool-timeout-ms: ${CHATCHAT_TOOL_TIMEOUT_MS:1800000}
    max-batch-calls: ${CHATCHAT_MAX_BATCH_CALLS:32}
    max-batch-payload-bytes: ${CHATCHAT_MAX_BATCH_PAYLOAD_BYTES:262144}
  search:
    engine: lucene
  tools:
    document-search:
      api-base-url: ${CHATCHAT_API_BASE_URL:http://localhost:8080}
      auth:
        username: ${CHATCHAT_INTERNAL_USERNAME:chatchat_mcp_internal}
        password: ${CHATCHAT_INTERNAL_SECRET:chatchat_internal_default_secret}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: false

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: logs/chatchat.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 14
      total-size-cap: 2GB
      clean-history-on-start: true
  level:
    com.chatchat: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
