spring:
  config:
    # Database type selector: datasource-mysql.yml or datasource-h2.yml.
    import: datasource-mysql.yml
  application:
    name: chatchat-mcp-server

server:
  port: 8090
  servlet:
    context-path: /
  shutdown: graceful

chatchat:
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: "ENC(RJGDk0FA9Xht7fHK:VBpgvsk5UR2XGCoSxNL7eqlS0Lu4r2UG1U6vvQ6NM7KBEwQ6/5j09M/A+mdijO9H)"
    crypto-key-file: ./config/internal-credential.key
  license:
    fail-startup-on-invalid: false
    status-check-interval-ms: 60000
    license-file: ./data/license/license.dat
    server-id-file: ./data/license/server.id
    public-key-path: ./data/license/license-public.pem
  audit:
    default-query-window-days: ${CHATCHAT_AUDIT_DEFAULT_QUERY_WINDOW_DAYS:7}
  mcp:
    python:
      workspace-root: ${CHATCHAT_MCP_PYTHON_WORKSPACE_ROOT:./data/python-assets}
      data-root: ${CHATCHAT_MCP_PYTHON_DATA_ROOT:./data/python-user-data}
      max-data-file-bytes: ${CHATCHAT_MCP_PYTHON_MAX_DATA_FILE_BYTES:52428800}
      docker-command: ${CHATCHAT_MCP_PYTHON_DOCKER_COMMAND:docker}
      output-limit-bytes: ${CHATCHAT_MCP_PYTHON_OUTPUT_LIMIT_BYTES:1000000}
    market:
      require-dedicated-storage: true
      query-timeout-seconds: ${CHATCHAT_MARKET_QUERY_TIMEOUT_SECONDS:15}
      max-concurrent-queries: ${CHATCHAT_MARKET_MAX_CONCURRENT_QUERIES:4}
      query-queue-timeout-ms: ${CHATCHAT_MARKET_QUERY_QUEUE_TIMEOUT_MS:100}
      query-pool:
        enabled: ${CHATCHAT_MARKET_QUERY_POOL_ENABLED:true}
        storage: ${CHATCHAT_MARKET_STORAGE:LOCAL_H2}
        local-jdbc-url: "${CHATCHAT_MARKET_H2_JDBC_URL:jdbc:h2:file:./data/h2/financial-market;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE}"
        local-username: ${CHATCHAT_MARKET_H2_USERNAME:sa}
        local-password: ${CHATCHAT_MARKET_H2_PASSWORD:}
        snapshot-root: ${CHATCHAT_MARKET_H2_SNAPSHOT_ROOT:./data/h2/financial-snapshots}
        snapshot-database-name: ${CHATCHAT_MARKET_H2_SNAPSHOT_DB:financial-market}
        write-pool-size: ${CHATCHAT_MARKET_WRITE_POOL_SIZE:1}
        maximum-pool-size: ${CHATCHAT_MARKET_QUERY_POOL_SIZE:4}
        minimum-idle: ${CHATCHAT_MARKET_QUERY_POOL_MIN_IDLE:0}
        connection-timeout-ms: ${CHATCHAT_MARKET_QUERY_POOL_CONNECTION_TIMEOUT_MS:2000}
        query-timeout-seconds: ${CHATCHAT_MARKET_QUERY_POOL_QUERY_TIMEOUT_SECONDS:15}
        network-timeout-ms: ${CHATCHAT_MARKET_QUERY_POOL_NETWORK_TIMEOUT_MS:17000}
        server-execution-timeout-ms: ${CHATCHAT_MARKET_QUERY_POOL_SERVER_EXECUTION_TIMEOUT_MS:15000}
    news-runtime:
      base-url: http://localhost:8091
      timeout-millis: ${CHATCHAT_NEWS_RUNTIME_TIMEOUT_MILLIS:20000}
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    admin:
      token-ttl-minutes: 480
    security:
      require-mcp-token: true
      encrypted-invocation-token: "${CHATCHAT_MCP_ENCRYPTED_INVOCATION_TOKEN:${chatchat.internal-credential.encrypted-secret:}}"
    authorization:
      enabled: true
      fail-open: false
      require-tenant-context: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password: "${CHATCHAT_MCP_API_ENCRYPTED_PASSWORD:${chatchat.internal-credential.encrypted-secret:}}"
        bearer-token:
    command-templates:
      seed-defaults-enabled: true
    sql-templates:
      seed-defaults-enabled: true
    lucene:
      enabled: true
      engine: opensearch
      index-dir: ./data/lucene/mcp
      open-search:
        enabled: true
        url: https://localhost:9200
        username: admin
        password:
        index-prefix: chatchat_mcp_dev_
        insecure-ssl: true
        request-timeout-ms: 30000
        debug-search: true
        search-concurrency:
          enabled: true
          request-timeout-ms: 8000
          retry-429-attempts: 1
          retry-backoff-min-ms: 100
          retry-backoff-max-ms: 300
          lexical:
            max-running: 12
            queue-capacity: 30
            queue-timeout-ms: 1500
          vector:
            max-running: 4
            queue-capacity: 10
            queue-timeout-ms: 500
        embedding:
          request-timeout-ms: 300000
          enabled: true
          endpoint: https://tokenhub.tencentmaas.com/v1/embeddings
          api-key: ${CHATCHAT_EMBEDDING_API_KEY:}
          model: kinfra-text-embedding-4b
          dimension: 1024
          vector-field: mcpContentVector
          max-input-chars: 6000
          vector-candidate-limit: 50
    server:
      endpoint: /mcp
      document-search:
        api-base-url: http://localhost:8080
        auth:
          username: chatchat_mcp_internal
          encrypted-password: "${CHATCHAT_MCP_API_ENCRYPTED_PASSWORD:${chatchat.internal-credential.encrypted-secret:}}"
          bearer-token:
  tools:
    document-search:
      enabled: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password: "${CHATCHAT_MCP_API_ENCRYPTED_PASSWORD:${chatchat.internal-credential.encrypted-secret:}}"
        bearer-token:
logging:
  file:
    name: ./logs/chatchat-mcp-server.log
  level:
    root: INFO
    com.chatchat: INFO
    io.modelcontextprotocol: INFO
    org.springframework.boot.autoconfigure: WARN
    org.hibernate: WARN
