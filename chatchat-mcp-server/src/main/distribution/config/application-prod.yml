spring:
  application:
    name: chatchat-mcp-server
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: "jdbc:h2:file:./data/h2/chatchat-mcp-server;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

server:
  port: 8090
  servlet:
    context-path: /
  shutdown: graceful

chatchat:
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret:
    secret: chatchat_internal_default_secret
    crypto-key:
    crypto-key-file:
  license:
    fail-startup-on-invalid: false
    status-check-interval-ms: 60000
    license-file: ./data/license/license.dat
    server-id-file: ./data/license/server.id
    public-key-path: ./data/license/license-public.pem
  mcp:
    news-runtime:
      base-url: http://localhost:8091
      timeout-millis: 30000
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    admin:
      username: admin
      password:
      encrypted-password:
      token-ttl-minutes: 480
    security:
      require-mcp-token: true
      encrypted-invocation-token:
      invocation-token: chatchat_internal_default_secret
    authorization:
      enabled: true
      fail-open: false
      require-tenant-context: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password:
        password: chatchat_internal_default_secret
        bearer-token:
    command-templates:
      seed-defaults-enabled: false
    sql-templates:
      seed-defaults-enabled: true
    lucene:
      enabled: true
      engine: lucene
      index-dir: ./data/lucene/mcp
    server:
      endpoint: /mcp
      document-search:
        api-base-url: http://localhost:8080
        auth:
          username: chatchat_mcp_internal
          encrypted-password:
          password: chatchat_internal_default_secret
          bearer-token:
  tools:
    document-search:
      enabled: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password:
        password: chatchat_internal_default_secret
        bearer-token:
logging:
  config: file:./config/logback-spring.xml
  file:
    name: ./logs/chatchat-mcp-server.log
  level:
    root: INFO
    com.chatchat: INFO
    io.modelcontextprotocol: INFO
    org.springframework.boot.autoconfigure: WARN
    org.hibernate: WARN
