spring:
  config:
    # Database type selector: datasource-mysql.yml or datasource-h2.yml.
    import: datasource-h2.yml
  application:
    name: chatchat-mcp-server

server:
  port: 8090
  servlet:
    context-path: /
  shutdown: graceful

chatchat:
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: "ENC(dt5Pfih5uB3eHVuG:H+kw3gs+C6vYEB6mKEHMOV9ayhJl0Udwhzyh0T2b2ULxNJ9xzPraje8HDDoXXjbHggxcJiZ4McExLoV0)"
    crypto-key-file: ./config/internal-credential.key
  license:
    fail-startup-on-invalid: false
    status-check-interval-ms: 60000
    license-file: ./data/license/license.dat
    server-id-file: ./data/license/server.id
    public-key-path: ./data/license/license-public.pem
  audit:
    default-query-window-days: 7
  mcp:
    template-discovery:
      runtime-managed-environment: ""
      policy-version: template_query_result.v1
      max-candidate-count: 60
      max-pages: 3
    grpc:
      client:
        enabled: false
      server:
        enabled: true
        port: 9091
        chunk-bytes: 1048576
        max-inbound-message-bytes: 67108864
        plaintext: false
        certificate-chain-path: 
        private-key-path: 
    python:
      workspace-root: ./data/python-assets
      data-root: ./data/python-user-data
      max-data-file-bytes: 52428800
      docker-command: docker
      output-limit-bytes: 1000000
    market:
      require-dedicated-storage: true
      query-timeout-seconds: 15
      max-concurrent-queries: 4
      query-queue-timeout-ms: 100
      query-pool:
        enabled: true
        storage: LOCAL_H2
        local-jdbc-url: "jdbc:h2:file:./data/h2/financial-market;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE"
        local-username: sa
        local-password: 
        snapshot-root: ./data/h2/financial-snapshots
        snapshot-database-name: financial-market
        write-pool-size: 1
        maximum-pool-size: 4
        minimum-idle: 0
        connection-timeout-ms: 2000
        query-timeout-seconds: 15
        network-timeout-ms: 17000
        server-execution-timeout-ms: 15000
    news-runtime:
      base-url: http://localhost:8091
      timeout-millis: 20000
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    admin:
      token-ttl-minutes: 480
    security:
      require-mcp-token: true
      encrypted-invocation-token: "ENC(dt5Pfih5uB3eHVuG:H+kw3gs+C6vYEB6mKEHMOV9ayhJl0Udwhzyh0T2b2ULxNJ9xzPraje8HDDoXXjbHggxcJiZ4McExLoV0)"
    authorization:
      enabled: true
      fail-open: false
      require-tenant-context: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password: ""
        bearer-token:
    command-templates:
      seed-defaults-enabled: false
    sql-templates:
      seed-defaults-enabled: true
    lucene:
      enabled: true
      engine: lucene
      index-dir: ./data/lucene/mcp
    server:
      endpoint: /mcp
      document-search:
        default-limit: 8
        max-limit: 20
        timeout-ms: 300000
        runtime-level: readonly
        confirmation-default: ask_before_execute
  tools:
logging:
  config: file:./config/logback-spring.xml
  file:
    name: ./logs/chatchat-mcp-server.log
  level:
    root: INFO
    com.chatchat: INFO
    io.modelcontextprotocol: INFO
    org.springframework.boot.autoconfigure: WARN
    org.hibernate: WARN
