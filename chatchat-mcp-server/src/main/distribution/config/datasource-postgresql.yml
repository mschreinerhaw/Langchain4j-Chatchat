spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: "${CHATCHAT_MCP_POSTGRESQL_URL:jdbc:postgresql://127.0.0.1:5432/live_runtime_mcp}"
    driver-class-name: org.postgresql.Driver
    username: ${CHATCHAT_MCP_POSTGRESQL_USERNAME:chatchat_mcp}
    password: ${CHATCHAT_MCP_POSTGRESQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${CHATCHAT_MCP_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${CHATCHAT_MCP_DB_MIN_IDLE:2}
      connection-timeout: ${CHATCHAT_MCP_DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${CHATCHAT_MCP_DB_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${CHATCHAT_MCP_DB_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${CHATCHAT_MCP_DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${CHATCHAT_MCP_DB_KEEPALIVE_MS:30000}
      leak-detection-threshold: ${CHATCHAT_MCP_DB_LEAK_DETECTION_MS:60000}
      connection-init-sql: "SET lock_timeout = '${CHATCHAT_MCP_DB_LOCK_WAIT_SECONDS:5}s'"
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      jakarta.persistence.query.timeout: 30000
