# Environment template for bin/start.sh and bin/start.bat.
# Put machine-specific secrets in config/env.local; it is intentionally ignored by git.
# Leave SPRING_PROFILES_ACTIVE unset to use spring.profiles.default from config/application.yml.
# SPRING_PROFILES_ACTIVE=dev

# Runtime database/search mode is controlled by application-*.yml.
# Copy one of the application-*.template presets to the active application file when switching modes.
# Set CHATCHAT_DATASOURCE_MIGRATION_ENABLED=true once to copy H2 data into an empty MySQL schema.
CHATCHAT_DATASOURCE_MIGRATION_ENABLED=false

# Set true when OpenSearch uses a self-signed certificate or an IP address not listed in the certificate SAN.
# Set false when OpenSearch uses a trusted certificate and hostname.
CHATCHAT_OPENSEARCH_INSECURE_SSL=true

# Optional LiveData integration
CHAT_MCP_LIVEDATA_ENABLED=false
CHAT_MCP_LIVEDATA_JDBC_URL=
CHAT_MCP_LIVEDATA_USERNAME=
CHAT_MCP_LIVEDATA_PASSWORD=
CHAT_MCP_LIVEDATA_DRIVER_CLASS=com.mysql.cj.jdbc.Driver
CHAT_MCP_LIVEDATA_SERVICE_BASE_URL=
CHAT_MCP_LIVEDATA_LOGIN_ID=
CHAT_MCP_LIVEDATA_LOGIN_PASSWORD=
CHAT_MCP_LIVEDATA_AMS_TOKEN=

# Spring Boot canonical overrides used after removing YAML placeholders.
# Leave profile-sensitive datasource/OpenSearch endpoints empty to retain the active YAML profile defaults.
SERVER_PORT=8090
SPRING_DATASOURCE_URL=
SPRING_DATASOURCE_USERNAME=
SPRING_DATASOURCE_PASSWORD=

CHATCHAT_INTERNAL_CREDENTIAL_USERNAME=chatchat_mcp_internal
CHATCHAT_INTERNAL_CREDENTIAL_ENCRYPTED_SECRET=
CHATCHAT_INTERNAL_CREDENTIAL_SECRET=chatchat_internal_default_secret
CHATCHAT_INTERNAL_CREDENTIAL_CRYPTO_KEY=
CHATCHAT_INTERNAL_CREDENTIAL_CRYPTO_KEY_FILE=

CHATCHAT_LICENSE_FAIL_STARTUP_ON_INVALID=false
CHATCHAT_LICENSE_STATUS_CHECK_INTERVAL_MS=60000
CHATCHAT_LICENSE_LICENSE_FILE=./data/license/license.dat
CHATCHAT_LICENSE_SERVER_ID_FILE=./data/license/server.id
CHATCHAT_LICENSE_PUBLIC_KEY_PATH=./data/license/license-public.pem

CHATCHAT_MCP_MARKET_RETENTION_ENABLED=true
CHATCHAT_MCP_MARKET_RETENTION_HOT_DAYS=7
CHATCHAT_MCP_MARKET_RETENTION_WEEKLY_ARCHIVE_DAYS=1825
CHATCHAT_MCP_MARKET_RETENTION_CRON=0 30 2 * * SUN
CHATCHAT_MCP_MARKET_RETENTION_ZONE_ID=Asia/Shanghai
CHATCHAT_MCP_NEWS_RUNTIME_BASE_URL=http://localhost:8091
CHATCHAT_MCP_NEWS_RUNTIME_TIMEOUT_MILLIS=30000
CHATCHAT_MCP_CAPABILITIES_NEWS_ENABLED=true

CHATCHAT_MCP_ADMIN_USERNAME=admin
CHATCHAT_MCP_ADMIN_PASSWORD=
CHATCHAT_MCP_ADMIN_ENCRYPTED_PASSWORD=
CHATCHAT_MCP_ADMIN_TOKEN_TTL_MINUTES=480
CHATCHAT_MCP_SECURITY_ENCRYPTED_INVOCATION_TOKEN=
CHATCHAT_MCP_SECURITY_INVOCATION_TOKEN=chatchat_internal_default_secret

CHATCHAT_MCP_AUTHORIZATION_ENABLED=true
CHATCHAT_MCP_AUTHORIZATION_FAIL_OPEN=false
CHATCHAT_MCP_AUTHORIZATION_REQUIRE_TENANT_CONTEXT=true
CHATCHAT_MCP_AUTHORIZATION_API_BASE_URL=http://localhost:8080
CHATCHAT_MCP_AUTHORIZATION_AUTH_USERNAME=chatchat_mcp_internal
CHATCHAT_MCP_AUTHORIZATION_AUTH_ENCRYPTED_PASSWORD=
CHATCHAT_MCP_AUTHORIZATION_AUTH_PASSWORD=chatchat_internal_default_secret
CHATCHAT_MCP_AUTHORIZATION_AUTH_BEARER_TOKEN=

CHATCHAT_MCP_LUCENE_OPEN_SEARCH_URL=
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_USERNAME=
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_PASSWORD=
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_INDEX_PREFIX=chatchat_mcp_
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_INSECURE_SSL=true
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_DEBUG_SEARCH=false
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_SEARCH_CONCURRENCY_ENABLED=true
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_SEARCH_CONCURRENCY_REQUEST_TIMEOUT_MS=8000
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_SEARCH_CONCURRENCY_RETRY_429_ATTEMPTS=1
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_SEARCH_CONCURRENCY_LEXICAL_MAX_RUNNING=12
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_SEARCH_CONCURRENCY_VECTOR_MAX_RUNNING=4
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_EMBEDDING_REQUEST_TIMEOUT_MS=300000
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_EMBEDDING_ENABLED=false
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_EMBEDDING_ENDPOINT=
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_EMBEDDING_API_KEY=
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_EMBEDDING_MODEL=text-embedding-v4
CHATCHAT_MCP_LUCENE_OPEN_SEARCH_EMBEDDING_DIMENSION=1024

CHATCHAT_MCP_SERVER_DOCUMENT_SEARCH_API_BASE_URL=http://localhost:8080
CHATCHAT_MCP_SERVER_DOCUMENT_SEARCH_AUTH_USERNAME=chatchat_mcp_internal
CHATCHAT_MCP_SERVER_DOCUMENT_SEARCH_AUTH_ENCRYPTED_PASSWORD=
CHATCHAT_MCP_SERVER_DOCUMENT_SEARCH_AUTH_PASSWORD=chatchat_internal_default_secret
CHATCHAT_MCP_SERVER_DOCUMENT_SEARCH_AUTH_BEARER_TOKEN=
CHATCHAT_TOOLS_DOCUMENT_SEARCH_API_BASE_URL=http://localhost:8080
