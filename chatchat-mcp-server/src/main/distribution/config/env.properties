CHATCHAT_TOOLS_DOCUMENT_SEARCH_AUTH_ENCRYPTED_PASSWORD=
CHATCHAT_TOOLS_DOCUMENT_SEARCH_AUTH_PASSWORD=chatchat_internal_default_secret
CHATCHAT_TOOLS_DOCUMENT_SEARCH_AUTH_BEARER_TOKEN=
CHATCHAT_TOOLS_DATABASE_QUERY_WORKFLOW_MAX_PARALLELISM=4
