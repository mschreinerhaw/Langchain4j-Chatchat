spring:
  config:
    # Database type selector: datasource-mysql.yml or datasource-h2.yml.
    import: datasource-mysql.yml
  application:
    name: chatchat-mcp-server

server:
  port: 8090
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful

chatchat:
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: "ENC(dt5Pfih5uB3eHVuG:H+kw3gs+C6vYEB6mKEHMOV9ayhJl0Udwhzyh0T2b2ULxNJ9xzPraje8HDDoXXjbHggxcJiZ4McExLoV0)"
    crypto-key-file: ./config/internal-credential.key
  license:
    fail-startup-on-invalid: false
    status-check-interval-ms: 60000
    license-file: ./data/license/license.dat
    server-id-file: ./data/license/server.id
    public-key-path: ./data/license/license-public.pem
  audit:
    default-query-window-days: 7
  mcp:
    grpc:
      client:
        enabled: false
      server:
        enabled: true
        port: 9091
        chunk-bytes: 1048576
        max-inbound-message-bytes: 67108864
        plaintext: true
        certificate-chain-path: 
        private-key-path: 
    python:
      workspace-root: ./data/python-assets
      data-root: ./data/python-user-data
      max-data-file-bytes: 52428800
      docker-command: docker
      output-limit-bytes: 1000000
    market:
      require-dedicated-storage: true
      query-timeout-seconds: 15
      max-concurrent-queries: 4
      query-queue-timeout-ms: 100
      query-cache:
        enabled: true
        storage: ROCKSDB
        ttl-seconds: 1800
        fallback-to-rocks-db: true
        max-entry-kb: 2048
        single-flight-grace-ms: 500
      query-pool:
        enabled: true
        storage: LOCAL_H2
        local-jdbc-url: "jdbc:h2:file:./data/h2/financial-market;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE"
        local-username: sa
        local-password:
        snapshot-root: ./data/h2/financial-snapshots
        snapshot-database-name: financial-market
        write-pool-size: 1
        maximum-pool-size: 4
        minimum-idle: 0
        connection-timeout-ms: 2000
        query-timeout-seconds: 15
        network-timeout-ms: 17000
        server-execution-timeout-ms: 15000
      retention:
        enabled: true
        hot-days: 7
        weekly-archive-days: 1825
        cron: "0 30 2 * * SUN"
        zone-id: Asia/Shanghai
    news-runtime:
      base-url: http://localhost:8091
      timeout-millis: 20000
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
          financial_data_search: { enabled: false, agent-callable: false, timeout: 20s }
    admin:
      token-ttl-minutes: 480
    security:
      require-mcp-token: true
      encrypted-invocation-token: ""
    authorization:
      enabled: true
      fail-open: false
      unavailable-retry-interval-ms: 1000
      require-tenant-context: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password: ""
        bearer-token:
    notifications:
      # Enable notification/alert MCP tool publishing in development.
      # Individual channels remain controlled from the admin page.
      enabled: true
    command-templates:
      seed-defaults-enabled: true
    sql-templates:
      seed-defaults-enabled: true
    lucene:
      enabled: true
      engine: opensearch
      index-dir: ./data/lucene/mcp
      open-search:
        enabled: true
        url:  https://127.0.0.1:9200
        username: admin
        password:
        index-prefix: chatchat_mcp_dev_
        insecure-ssl: true
        request-timeout-ms: 30000
        debug-search: true
        search-concurrency:
          enabled: true
          request-timeout-ms: 8000
          retry-429-attempts: 1
          retry-backoff-min-ms: 100
          retry-backoff-max-ms: 300
          lexical:
            max-running: 12
            queue-capacity: 30
            queue-timeout-ms: 1500
          vector:
            max-running: 4
            queue-capacity: 10
            queue-timeout-ms: 500
        embedding:
          request-timeout-ms: 300000
          enabled: true
          endpoint: https://tokenhub.tencentmaas.com/v1/embeddings
          api-key: 
          model: kinfra-text-embedding-4b
          dimension: 1024
          vector-field: mcpContentVector
          max-input-chars: 6000
          vector-candidate-limit: 50
    server:
      endpoint: /mcp
      concurrency:
        tools:
          linux_command_execute:
            max-output-chars: 10485760
      document-search:
        api-base-url: http://localhost:8080
        auth:
          username: chatchat_mcp_internal
          encrypted-password: ""
          bearer-token:
  tools:
    document-search:
      enabled: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password: ""
        bearer-token:
    livedata:
      # Runtime values are maintained on the admin page. Database access is bound through a database asset.
      enabled: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ./logs/chatchat-mcp-server.log
  level:
    root: INFO
    com.chatchat: INFO
    io.modelcontextprotocol: INFO
    org.springframework.boot.autoconfigure: WARN
    org.hibernate: WARN
