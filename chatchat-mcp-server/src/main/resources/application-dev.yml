spring:
  config:
    # Database type selector: datasource-mysql.yml or datasource-h2.yml.
    import: datasource-mysql.yml
  application:
    name: chatchat-mcp-server

server:
  port: 8090
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful

chatchat:
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret:
    secret: chatchat_internal_default_secret
    crypto-key:
    crypto-key-file:
  license:
    fail-startup-on-invalid: false
    status-check-interval-ms: 60000
    license-file: ./data/license/license.dat
    server-id-file: ./data/license/server.id
    public-key-path: ./data/license/license-public.pem
  mcp:
    market:
      retention:
        enabled: true
        hot-days: 7
        weekly-archive-days: 1825
        cron: "0 30 2 * * SUN"
        zone-id: Asia/Shanghai
    news-runtime:
      base-url: http://localhost:8091
      timeout-millis: 30000
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    admin:
      token-ttl-minutes: 480
    security:
      require-mcp-token: true
      encrypted-invocation-token:
      invocation-token: chatchat_internal_default_secret
    authorization:
      enabled: true
      fail-open: false
      require-tenant-context: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password:
        password: chatchat_internal_default_secret
        bearer-token:
    notifications:
      # Enable notification/alert MCP tool publishing in development.
      # Individual channels remain controlled from the admin page.
      enabled: true
    command-templates:
      seed-defaults-enabled: true
    sql-templates:
      seed-defaults-enabled: true
    lucene:
      enabled: true
      engine: opensearch
      index-dir: ./data/lucene/mcp
      open-search:
        enabled: true
        url: https://192.168.195.221:9200
        username: admin
        password: apexSoft12345
        index-prefix: chatchat_mcp_dev_
        insecure-ssl: true
        request-timeout-ms: 30000
        debug-search: true
        search-concurrency:
          enabled: true
          request-timeout-ms: 8000
          retry-429-attempts: 1
          retry-backoff-min-ms: 100
          retry-backoff-max-ms: 300
          lexical:
            max-running: 12
            queue-capacity: 30
            queue-timeout-ms: 1500
          vector:
            max-running: 4
            queue-capacity: 10
            queue-timeout-ms: 500
        embedding:
          request-timeout-ms: 300000
          enabled: true
          endpoint: https://tokenhub.tencentmaas.com/v1/embeddings
          api-key: sk-e9xW4FEk6ONVAy50XyQunS7A6dmE1a9X1errk7LW7yShFcvL
          model: kinfra-text-embedding-4b
          dimension: 1024
          vector-field: mcpContentVector
          max-input-chars: 6000
          vector-candidate-limit: 50
    server:
      endpoint: /mcp
      document-search:
        api-base-url: http://localhost:8080
        auth:
          username: chatchat_mcp_internal
          encrypted-password:
          password: chatchat_internal_default_secret
          bearer-token:
  tools:
    document-search:
      enabled: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password:
        password: chatchat_internal_default_secret
        bearer-token:
    livedata:
      # Runtime values are maintained on the admin page. Database access is bound through a database asset.
      enabled: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ./logs/chatchat-mcp-server.log
  level:
    root: INFO
    com.chatchat: INFO
    io.modelcontextprotocol: INFO
    org.springframework.boot.autoconfigure: WARN
    org.hibernate: WARN
