spring:
  config:
    # Database type selector: datasource-mysql.yml or datasource-h2.yml.
    import: datasource-h2.yml
  application:
    name: chatchat-mcp-server

server:
  port: 8090
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful

chatchat:
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: "ENC(RJGDk0FA9Xht7fHK:VBpgvsk5UR2XGCoSxNL7eqlS0Lu4r2UG1U6vvQ6NM7KBEwQ6/5j09M/A+mdijO9H)"
    crypto-key-file: ./config/internal-credential.key
  license:
    fail-startup-on-invalid: false
    status-check-interval-ms: 60000
    license-file: ./data/license/license.dat
    server-id-file: ./data/license/server.id
    public-key-path: ./data/license/license-public.pem
  mcp:
    market:
      query-timeout-seconds: ${CHATCHAT_MARKET_QUERY_TIMEOUT_SECONDS:15}
      max-concurrent-queries: ${CHATCHAT_MARKET_MAX_CONCURRENT_QUERIES:4}
      query-queue-timeout-ms: ${CHATCHAT_MARKET_QUERY_QUEUE_TIMEOUT_MS:100}
      query-cache:
        enabled: ${CHATCHAT_MARKET_QUERY_CACHE_ENABLED:true}
        storage: ${CHATCHAT_MARKET_QUERY_CACHE_STORAGE:ROCKSDB}
        ttl-seconds: ${CHATCHAT_MARKET_QUERY_CACHE_TTL_SECONDS:1800}
        fallback-to-rocks-db: ${CHATCHAT_MARKET_QUERY_CACHE_FALLBACK_TO_ROCKSDB:true}
        max-entry-kb: ${CHATCHAT_MARKET_QUERY_CACHE_MAX_ENTRY_KB:2048}
        single-flight-grace-ms: ${CHATCHAT_MARKET_QUERY_CACHE_SINGLE_FLIGHT_GRACE_MS:500}
      query-pool:
        enabled: ${CHATCHAT_MARKET_QUERY_POOL_ENABLED:true}
        maximum-pool-size: ${CHATCHAT_MARKET_QUERY_POOL_SIZE:4}
        minimum-idle: ${CHATCHAT_MARKET_QUERY_POOL_MIN_IDLE:0}
        connection-timeout-ms: ${CHATCHAT_MARKET_QUERY_POOL_CONNECTION_TIMEOUT_MS:2000}
        query-timeout-seconds: ${CHATCHAT_MARKET_QUERY_POOL_QUERY_TIMEOUT_SECONDS:15}
      retention:
        enabled: true
        hot-days: 7
        weekly-archive-days: 1825
        cron: "0 30 2 * * SUN"
        zone-id: Asia/Shanghai
    news-runtime:
      base-url: http://localhost:8091
      timeout-millis: ${CHATCHAT_NEWS_RUNTIME_TIMEOUT_MILLIS:20000}
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
          financial_data_search: { enabled: false, agent-callable: false, timeout: 20s }
    admin:
      token-ttl-minutes: 480
    security:
      require-mcp-token: true
      encrypted-invocation-token:
    authorization:
      enabled: true
      fail-open: false
      require-tenant-context: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password:
        bearer-token:
    command-templates:
      seed-defaults-enabled: false
    sql-templates:
      seed-defaults-enabled: true
    lucene:
      enabled: true
      engine: lucene
      index-dir: ./data/lucene/mcp
    server:
      endpoint: /mcp
      concurrency:
        tools:
          linux_command_execute:
            max-output-chars: 10485760
      document-search:
        api-base-url: http://localhost:8080
        auth:
          username: chatchat_mcp_internal
          encrypted-password:
          bearer-token:
  tools:
    document-search:
      enabled: true
      api-base-url: http://localhost:8080
      auth:
        username: chatchat_mcp_internal
        encrypted-password:
        bearer-token:
logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ./logs/chatchat-mcp-server.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 14
      total-size-cap: 2GB
      clean-history-on-start: true
  level:
    root: INFO
    com.chatchat: INFO
    io.modelcontextprotocol: INFO
    org.springframework.boot.autoconfigure: WARN
    org.hibernate: WARN
