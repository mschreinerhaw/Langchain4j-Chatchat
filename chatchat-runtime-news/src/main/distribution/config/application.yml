server:
  port: 8091
  shutdown: graceful

spring:
  application:
    name: chatchat-runtime-news
  profiles:
    default: h2
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false

logging:
  config: file:./config/logback-spring.xml
  file:
    name: ./logs/chatchat-runtime-news.log
  level:
    root: INFO
    com.chatchat.runtime.news: INFO

chatchat:
  # MCP 与 News Runtime 必须配置完全相同的内部账户。
  # API、MCP 与 News 必须配置相同密文，并通过独立密钥文件解密。
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: "ENC(RJGDk0FA9Xht7fHK:VBpgvsk5UR2XGCoSxNL7eqlS0Lu4r2UG1U6vvQ6NM7KBEwQ6/5j09M/A+mdijO9H)"
    crypto-key-file: ./config/internal-credential.key
  runtime:
    news:
      enabled: true
      collector-core-size: 2
      collector-max-size: 4
      collector-queue-capacity: 20
      max-items-per-run: 500
      bulk:
        queue-capacity: 5000
        batch-size: 300
        flush-interval-millis: 2000
        offer-timeout-millis: 3000
        max-retries: 2
      attachment:
        enabled: true
        worker-count: 2
        queue-capacity: 500
        max-file-bytes: 26214400
        max-attachments-per-article: 20
        max-extracted-chars: 2000000
        chunk-size: 1200
        chunk-overlap: 150
        max-chunks-per-attachment: 500
      # 采集日志默认只保留 7 天；只清理 news_collect_record，不删除资讯正文索引。
      collect-log:
        enabled: true
        retention-days: 7
        cleanup-batch-size: 1000
        max-batches-per-run: 100
        cleanup-cron: "0 30 0 * * *"
        zone-id: Asia/Shanghai
      # 腾讯云 WSA 仅增强既有 web_search 的内部召回，不发布独立 MCP 工具。
      web-search:
        enabled: false
        endpoint: https://wsa.tencentcloudapi.com
        secret-id: ""
        secret-key: ""
        region: ""
        mode: 2
        request-count-enabled: false
        max-results: 20
        timeout-millis: 10000
        hotspot-lookback-days: 7
        max-snippet-chars: 1200
        # Dedicated OpenSearch cache for paid web-search responses.
        cache:
          enabled: true
          # true: bypass cached results and call Tencent WSA for every request.
          force-external: false
          index-name: runtime-web-search-cache
          retention-days: 7
          minimum-similarity: 0.72
          max-candidates: 10
          cleanup-cron: "0 45 0 * * *"
          zone-id: Asia/Shanghai
      open-search:
        enabled: true
        endpoint: http://127.0.0.1:9200
        username: ""
        password: ""
        insecure-ssl: false
        index-name: runtime-news
        retention-days: 7
        rebuild-cron: "0 0 0 * * *"
        zone-id: Asia/Shanghai
        retention-cron: "0 15 0 * * *"
        embedding:
          enabled: false
          endpoint: ""
          api-key: ""
          model: text-embedding-v4
          dimension: 1024
          vector-field: embedding
          max-input-chars: 8000
          batch-size: 16
          request-timeout-millis: 120000
          vector-candidate-limit: 100
