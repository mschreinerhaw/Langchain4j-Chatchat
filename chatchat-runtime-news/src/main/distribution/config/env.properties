# Runtime News 环境覆盖配置。
# application.yml 保存可直接运行的默认值；这里使用 Spring Boot 标准环境变量名覆盖对应配置。
# 如需保存机器私有密钥，可复制到同目录 env.local；启动脚本会在本文件之后加载 env.local。

JAVA_OPTS=-Xms512m -Xmx2g -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
APP_ARGS=

# 内部 MCP
CHATCHAT_RUNTIME_NEWS_MCP_SERVER_BASE_URL=http://localhost:8090

# 腾讯云 WSA 联网检索
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_ENABLED=false
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_ENDPOINT=https://wsa.tencentcloudapi.com
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_SECRET_ID=
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_SECRET_KEY=
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_REGION=
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_MODE=2
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_REQUEST_COUNT_ENABLED=false
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_MAX_RESULTS=20
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_TIMEOUT_MILLIS=10000
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_HOTSPOT_LOOKBACK_DAYS=7
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_MAX_SNIPPET_CHARS=1200

# 联网检索结果缓存
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_CACHE_ENABLED=true
# true 时跳过缓存读取，每次调用腾讯 WSA；成功结果仍会写入缓存。
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_CACHE_FORCE_EXTERNAL=false
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_CACHE_INDEX_NAME=runtime-web-search-cache
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_CACHE_RETENTION_DAYS=7
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_CACHE_MINIMUM_SIMILARITY=0.72
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_CACHE_MAX_CANDIDATES=10
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_CACHE_CLEANUP_CRON=0 45 0 * * *
CHATCHAT_RUNTIME_NEWS_WEB_SEARCH_CACHE_ZONE_ID=Asia/Shanghai
