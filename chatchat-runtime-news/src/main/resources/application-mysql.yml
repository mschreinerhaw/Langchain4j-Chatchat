spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${CHATCHAT_NEWS_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/chatchat_news?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=25000&tcpKeepAlive=true}"
    username: ${CHATCHAT_NEWS_MYSQL_USERNAME:chatchat_news}
    password: ${CHATCHAT_NEWS_MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${CHATCHAT_NEWS_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${CHATCHAT_NEWS_DB_MIN_IDLE:2}
      connection-timeout: ${CHATCHAT_NEWS_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${CHATCHAT_NEWS_DB_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${CHATCHAT_NEWS_DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${CHATCHAT_NEWS_DB_MAX_LIFETIME_MS:1200000}
      leak-detection-threshold: ${CHATCHAT_NEWS_DB_LEAK_DETECTION_MS:60000}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
