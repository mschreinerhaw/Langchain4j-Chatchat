server:
  port: 8091
spring:
  application:
    name: chatchat-runtime-news
  profiles:
    default: h2
  jpa:
    open-in-view: false
chatchat:
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: ""
    secret: chatchat_internal_default_secret
    crypto-key: ""
    crypto-key-file: ""
  runtime:
    news:
      enabled: true
      mcp-server:
        base-url: ${CHATCHAT_MCP_SERVER_URL:http://localhost:8090}
      robots:
        enabled: true
        user-agent: ChatChat-NewsCollector
        request-timeout-millis: 10000
        max-file-bytes: 524288
        cache-ttl-millis: 1800000
      attachment:
        enabled: true
        worker-count: 2
        queue-capacity: 500
        max-file-bytes: 26214400
        max-attachments-per-article: 20
        max-extracted-chars: 2000000
        chunk-size: 1200
        chunk-overlap: 150
        max-chunks-per-attachment: 500
      collect-log:
        enabled: true
        retention-days: 7
        cleanup-batch-size: 1000
        max-batches-per-run: 100
        cleanup-cron: "0 30 0 * * *"
        zone-id: Asia/Shanghai
      analysis:
        enabled: true
        batch-size: 20
        poll-delay-millis: 5000
        summary-max-chars: 300
        max-tags: 8
      # Tencent WSA is an internal recall enhancer behind the existing web_search.
      # It is not registered or published as an independent MCP tool.
      web-search:
        enabled: ${CHATCHAT_WEB_SEARCH_ENHANCER_ENABLED:false}
        endpoint: ${TENCENT_WSA_ENDPOINT:https://wsa.tencentcloudapi.com}
        secret-id: ${TENCENT_CLOUD_SECRET_ID:}
        secret-key: ${TENCENT_CLOUD_SECRET_KEY:}
        region: ${TENCENT_WSA_REGION:}
        mode: ${TENCENT_WSA_MODE:2}
        request-count-enabled: ${TENCENT_WSA_REQUEST_COUNT_ENABLED:false}
        max-results: ${TENCENT_WSA_MAX_RESULTS:20}
        timeout-millis: ${TENCENT_WSA_TIMEOUT_MILLIS:10000}
        hotspot-lookback-days: ${TENCENT_WSA_HOTSPOT_LOOKBACK_DAYS:7}
        max-snippet-chars: ${TENCENT_WSA_MAX_SNIPPET_CHARS:1200}
      open-search:
        enabled: true
        endpoint: https://192.168.195.221:9200
        username: admin
        password: apexSoft12345
        insecure-ssl: true
        index-name: runtime-news
        retention-days: 7
        rebuild-cron: "0 0 0 * * *"
        zone-id: Asia/Shanghai
        embedding:
          enabled: false
          endpoint: https://llm-7upawl16up8649rh.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/embeddings
          api-key: sk-720436c855ac470bb955388d0e8c9b89
          model: qwen3.7-text-embedding
          dimension: 1024
          vector-field: embedding
          max-input-chars: 8000
          batch-size: 16
          request-timeout-millis: 120000
          vector-candidate-limit: 100
