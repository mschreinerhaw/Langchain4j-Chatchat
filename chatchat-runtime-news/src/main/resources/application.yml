server:
  port: 8091
spring:
  application:
    name: chatchat-runtime-news
  profiles:
    default: h2
  jpa:
    open-in-view: false
chatchat:
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: "ENC(RJGDk0FA9Xht7fHK:VBpgvsk5UR2XGCoSxNL7eqlS0Lu4r2UG1U6vvQ6NM7KBEwQ6/5j09M/A+mdijO9H)"
    crypto-key-file: ./config/internal-credential.key
  runtime:
    news:
      enabled: true
      mcp-server:
        base-url: http://localhost:8090
      robots:
        enabled: true
        user-agent: ChatChat-NewsCollector
        request-timeout-millis: 10000
        max-file-bytes: 524288
        cache-ttl-millis: 1800000
      attachment:
        enabled: true
        worker-count: 2
        queue-capacity: 500
        max-file-bytes: 26214400
        max-attachments-per-article: 20
        max-extracted-chars: 2000000
        chunk-size: 1200
        chunk-overlap: 150
        max-chunks-per-attachment: 500
      collect-log:
        enabled: true
        retention-days: 7
        cleanup-batch-size: 1000
        max-batches-per-run: 100
        cleanup-cron: "0 30 0 * * *"
        zone-id: Asia/Shanghai
      analysis:
        enabled: true
        batch-size: 20
        poll-delay-millis: 5000
        summary-max-chars: 300
        max-tags: 8
      # Tencent WSA is an internal recall enhancer behind the existing web_search.
      # It is not registered or published as an independent MCP tool.
      web-search:
        enabled: true
        endpoint: https://wsa.tencentcloudapi.com
        secret-id: ${TENCENTCLOUD_SECRET_ID:}
        secret-key: ${TENCENTCLOUD_SECRET_KEY:}
        region: ""
        # 0 is the cross-edition natural-search mode. The client also downgrades an unsupported richer mode once.
        mode: 0
        request-count-enabled: false
        max-results: 20
        timeout-millis: 10000
        hotspot-lookback-days: 7
        max-snippet-chars: 1200
        # Dedicated OpenSearch cache for paid web-search responses.
        cache:
          enabled: true
          # true: skip cache lookup and issue a fresh WSA request every time.
          force-external: false
          index-name: runtime-web-search-cache
          retention-days: 7
          minimum-similarity: 0.72
          max-candidates: 10
          cleanup-cron: "0 45 0 * * *"
          zone-id: Asia/Shanghai
      open-search:
        enabled: true
        endpoint: https://192.168.195.221:9200
        username: admin
        password: apexSoft12345
        insecure-ssl: true
        index-name: runtime-news
        retention-days: 7
        rebuild-cron: "0 0 0 * * *"
        zone-id: Asia/Shanghai
        embedding:
          enabled: false
          endpoint: https://tokenhub.tencentmaas.com/v1/embeddings
          api-key: sk-e9xW4FEk6ONVAy50XyQunS7A6dmE1a9X1errk7LW7yShFcvL
          model: kinfra-text-embedding-4b
          dimension: 1024
          vector-field: embedding
          max-input-chars: 8000
          batch-size: 16
          request-timeout-millis: 120000
          vector-candidate-limit: 100
