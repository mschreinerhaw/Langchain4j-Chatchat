<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native Cline · 执行控制台</title><link rel="stylesheet" href="/monitor/style.css"><script type="module" src="/monitor/app.js"></script></head>
<body><header><div class="brand"><span class="mark">C</span><div>Native Cline <small>执行控制台 · Standalone 4.1.26</small></div></div><div id="connection">尚未连接</div><button id="logout" hidden>退出</button></header>
<section id="login"><form id="login-form"><h1>观察每一步真实执行</h1><p>使用已授权的 Runtime OS 账户登录专项工作区。</p><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">进入控制台</button><p id="login-error" role="alert"></p></form></section>
<main id="console" hidden><aside class="sessions"><div class="section-heading"><h2>会话与任务</h2><button id="refresh">刷新</button></div><button id="new" class="primary">＋ 新建测试</button><input id="search" placeholder="搜索 Session / Task ID" aria-label="搜索会话"><select id="filter" aria-label="筛选模式"><option value="">全部模式</option><option value="native">Native 原生编码</option><option value="runtime">Runtime 业务集成</option></select><div id="sessions"></div></aside>
<section class="conversation"><div id="session-heading"><h1>选择会话，查看真实过程</h1><p>Native Core 提供执行过程；Runtime OS 验证业务交付。</p></div><div class="controls"><button id="cancel" disabled>取消任务</button><button id="reconcile" disabled>查询并对账</button><button id="details">执行详情 ↓</button></div><div id="messages" aria-live="polite"></div><div id="permissions"></div><form id="message-form"><textarea id="message" rows="3" placeholder="向当前 Native Session 发送需求或继续对话" aria-label="任务消息"></textarea><button id="send" type="submit" disabled>发送消息</button></form><div id="command-status" role="status"></div></section>
<aside class="execution"><h2>内部执行</h2><div id="state"><p>等待选择会话</p></div><h3>最近工具与步骤</h3><div id="timeline"></div></aside>
<section id="detail"><nav id="tabs"><button data-tab="models">Model Calls</button><button data-tab="tools">Tool Calls</button><button data-tab="skills">Skills / MCP</button><button data-tab="code">Code / Diff</button><button data-tab="python">Python Execution</button><button data-tab="events">Runtime Events</button><button data-tab="files">Files / Artifacts</button><button data-tab="diagnostics">Diagnostics</button></nav><div id="detail-content"></div></section></main>
<dialog id="create-dialog"><form id="create-form"><h2>新建真实测试</h2><label>测试模式<select id="mode"><option value="native">Native 原生编码测试</option><option value="runtime">Runtime 业务集成测试</option></select></label><div id="native-options"><label>受控工作区<select id="workspace"></select></label><p>原生执行完成与 Runtime 业务交付分别验证。</p></div><div id="runtime-options" hidden><label>既有授权模型<select id="model"></select></label><label>授权输入文件<select id="inputs" multiple size="6"></select></label><label>业务需求<textarea id="instruction" rows="5" required></textarea></label><p>通过 Runtime 现有分析入口创建任务，Python、预算和归档由 Runtime 管理。</p></div><p id="create-error" role="alert"></p><div class="dialog-actions"><button type="button" id="close-dialog">关闭</button><button class="primary" type="submit">创建</button></div></form></dialog>
</body></html>
