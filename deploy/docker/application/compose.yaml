name: runtime-os-app-stage

services:
  postgresql:
    image: ${POSTGRESQL_IMAGE:-postgres:16.9}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - 127.0.0.1:${POSTGRESQL_PORT:-15432}:5432
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./postgresql-init.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
      - ../../../database/init/postgresql:/opt/runtime-schema:ro
    secrets:
      - postgresql_admin_password
      - postgresql_api_password
      - postgresql_mcp_password
      - postgresql_news_password
    healthcheck:
      test: [CMD-SHELL, 'test -f "$${PGDATA}/.runtime-schema-initialized" && pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [control]
    mem_limit: 2g

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    entrypoint: [sh, /usr/local/bin/chatchat-redis-entrypoint.sh]
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-768mb}
    ports:
      - 127.0.0.1:${REDIS_PORT:-16379}:6379
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ../redis/entrypoint.sh:/usr/local/bin/chatchat-redis-entrypoint.sh:ro
    secrets: [redis_password]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --user chatchat --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [control]
    mem_limit: 1g

  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.12.0}
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    ports:
      - 127.0.0.1:${OPENSEARCH_PORT:-19200}:9200
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ../opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ${OPENSEARCH_CERTS_DIR:?Set OPENSEARCH_CERTS_DIR}:/usr/share/opensearch/config/certs:ro
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      # 503 is accepted only for transport readiness before security initialization.
      # Applications also require successful authenticated security-init completion.
      test: [CMD-SHELL, 'code=$$(curl --silent --output /dev/null --write-out "%{http_code}" --cacert config/certs/root-ca.pem https://localhost:9200); test "$$code" = 200 || test "$$code" = 401 || test "$$code" = 503']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [control]
    mem_limit: 2g

  opensearch-security-init:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.12.0}
    restart: 'no'
    depends_on:
      opensearch:
        condition: service_healthy
    entrypoint: [bash, /opt/runtime/init-security.sh]
    volumes:
      - ./opensearch-init-security.sh:/opt/runtime/init-security.sh:ro
      - ${OPENSEARCH_CERTS_DIR}:/usr/share/opensearch/config/certs:ro
    secrets: [opensearch_admin_password]
    networks: [control]

  api:
    image: ${API_IMAGE:?Set API_IMAGE}
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: ${STAGE_ROOT:?Set STAGE_ROOT}/config/api.env
    depends_on:
      postgresql:
        condition: service_healthy
      opensearch-security-init:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, /opt/runtime/service-healthcheck.sh, '8080', '', /api/v1/enterprise/auth/me]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/srv/app/config/
      CHATCHAT_DATASOURCE_CONFIG: datasource-postgresql.yml
      CHATCHAT_API_POSTGRESQL_URL: jdbc:postgresql://postgresql:5432/live_runtime_api
      CHATCHAT_API_POSTGRESQL_USERNAME: chatchat_api
      CHATCHAT_SEARCH_OPENSEARCH_URL: https://opensearch:9200
      CHATCHAT_SEARCH_OPENSEARCH_USERNAME: admin
      CHATCHAT_SEARCH_OPENSEARCH_INSECURE_SSL: 'false'
      SPRING_CONFIG_IMPORT: classpath:datasource-postgresql.yml,optional:configtree:/run/secrets/
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1536m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=/srv/app/config/opensearch-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit
      CHATCHAT_MCP_GRPC_HOST: mcp
      CHATCHAT_MCP_GRPC_PORT: "9091"
      CHATCHAT_CODING_ENABLED: "true"
      CHATCHAT_CODING_CLINE_ENABLED: "true"
      CHATCHAT_CODING_CLINE_NODE_URL: http://127.0.0.1:8791
      CHATCHAT_CODING_CLINE_ALLOWED_PEER_ADDRESSES: ${CODING_CALLBACK_ALLOWED_ADDRESSES:-}
      CHATCHAT_CODING_CLINE_ALLOWED_PEER_HOSTNAMES: ${CODING_CALLBACK_ALLOWED_HOSTNAMES:-coding-agent}
      CHATCHAT_CODING_CLINE_SHARED_SECRET_FILE: /run/secrets/coding_agent_shared_secret
      CHATCHAT_SEARCH_OPENSEARCH_INDEX: runtime_os_stage_documents
      CHATCHAT_CHAT_DETAIL_STORE_PATH: /srv/app/data/chat-rocksdb
      CHATCHAT_CHAT_DETAIL_STORE_EXTERNAL_TEXT_ENABLED: ${CHAT_EXTERNAL_TEXT_ENABLED:-true}
      CHATCHAT_CHAT_DETAIL_STORE_EXTERNAL_TEXT_MIGRATE_LEGACY_ON_READ: "false"
      CHATCHAT_UI_ARTIFACT_STORAGE_PATH: /srv/app/data/ui-artifacts
      CHATCHAT_MCP_CENTER_BASE_URL: http://mcp:8090
      CHATCHAT_TOOLS_DOCUMENT_SEARCH_API_BASE_URL: http://api:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:18180:8080
    volumes:
      - type: bind
        source: ${API_DATA_DIR:?Set API_DATA_DIR to the existing persistent API data directory}
        target: /srv/app/data
        bind:
          create_host_path: false
      - ${STAGE_ROOT}/api/logs:/srv/app/logs
      - ${MODEL_CONFIG_FILE:?Set MODEL_CONFIG_FILE}:/srv/app/config/application.yml:ro
      - ./service-healthcheck.sh:/opt/runtime/service-healthcheck.sh:ro
      - ${OPENSEARCH_TRUSTSTORE_FILE:?Set OPENSEARCH_TRUSTSTORE_FILE}:/srv/app/config/opensearch-truststore.p12:ro
    secrets:
      - source: api_internal_key
        target: /srv/app/config/internal-credential.key
      - coding_agent_shared_secret
      - source: postgresql_api_password
        target: CHATCHAT_API_POSTGRESQL_PASSWORD
      - source: opensearch_admin_password
        target: CHATCHAT_SEARCH_OPENSEARCH_PASSWORD
      - source: bootstrap_admin_password
        target: chatchat.enterprise.bootstrap.admin-password
      - source: internal_credential_encrypted
        target: chatchat.internal-credential.encrypted-secret
    networks:
      control: {}
      coding: {}
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 4

  mcp:
    image: ${MCP_IMAGE:?Set MCP_IMAGE}
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: ${STAGE_ROOT}/config/mcp.env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch-security-init:
        condition: service_completed_successfully
      news:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, /opt/runtime/service-healthcheck.sh, '8090', '9091', /api/v1/license/status]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      SERVER_PORT: "8090"
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1024m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=/run/runtime-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit
      CHATCHAT_DATASOURCE_CONFIG: datasource-postgresql.yml
      CHATCHAT_MCP_POSTGRESQL_URL: jdbc:postgresql://postgresql:5432/live_runtime_mcp
      CHATCHAT_MCP_POSTGRESQL_USERNAME: chatchat_mcp
      SPRING_CONFIG_IMPORT: classpath:datasource-postgresql.yml,optional:configtree:/run/secrets/
      CHATCHAT_MCP_LUCENE_OPENSEARCH_URL: https://opensearch:9200
      CHATCHAT_MCP_LUCENE_OPENSEARCH_USERNAME: admin
      CHATCHAT_MCP_LUCENE_OPENSEARCH_INSECURESSL: 'false'
      CHATCHAT_MCP_GRPC_PORT: "9091"
      CHATCHAT_MCP_AUTHORIZATION_API_BASE_URL: http://api:8080
      CHATCHAT_MCP_NEWS_RUNTIME_BASE_URL: http://news:8091
      CHATCHAT_LICENSE_HOST_MAC_FILE: /run/license/host-mac
      CHATCHAT_MCP_PYTHON_WORKSPACE_ROOT: ${MCP_PYTHON_WORKSPACE_ROOT:-${MCP_DATA_DIR:-${STAGE_ROOT}/mcp/data}/python-assets}
      CHATCHAT_MCP_PYTHON_DATA_ROOT: ${MCP_PYTHON_DATA_ROOT:-${MCP_DATA_DIR:-${STAGE_ROOT}/mcp/data}/python-user-data}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:18190:8090
    volumes:
      - type: bind
        source: ${MCP_DATA_DIR:?Set MCP_DATA_DIR to the existing persistent MCP data directory}
        target: /srv/app/data
        bind:
          create_host_path: false
      - ${MCP_PYTHON_WORKSPACE_ROOT:-${MCP_DATA_DIR:-${STAGE_ROOT}/mcp/data}/python-assets}:${MCP_PYTHON_WORKSPACE_ROOT:-${MCP_DATA_DIR:-${STAGE_ROOT}/mcp/data}/python-assets}
      - ${MCP_PYTHON_DATA_ROOT:-${MCP_DATA_DIR:-${STAGE_ROOT}/mcp/data}/python-user-data}:${MCP_PYTHON_DATA_ROOT:-${MCP_DATA_DIR:-${STAGE_ROOT}/mcp/data}/python-user-data}
      - ${STAGE_ROOT}/mcp/logs:/srv/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./service-healthcheck.sh:/opt/runtime/service-healthcheck.sh:ro
      - ${OPENSEARCH_TRUSTSTORE_FILE}:/run/runtime-truststore.p12:ro
      - type: bind
        source: ${MCP_HOST_MAC_FILE:?Set the host physical NIC address file}
        target: /run/license/host-mac
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - source: mcp_internal_key
        target: news_internal_key
      - source: postgresql_mcp_password
        target: CHATCHAT_MCP_POSTGRESQL_PASSWORD
      - source: opensearch_admin_password
        target: chatchat.mcp.lucene.open-search.password
      - source: internal_credential_encrypted
        target: chatchat.internal-credential.encrypted-secret
      - redis_password
    networks:
      - control
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 3

  news:
    image: ${NEWS_IMAGE:?Set NEWS_IMAGE}
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: ${STAGE_ROOT}/config/news.env
    depends_on:
      postgresql:
        condition: service_healthy
      opensearch-security-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, bash, /opt/runtime/service-healthcheck.sh, '8091', '', /internal/v1/news/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      SERVER_PORT: "8091"
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/srv/app/config/
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1024m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=/run/runtime-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit
      SPRING_PROFILES_ACTIVE: ${NEWS_PROFILE:-postgresql}
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      CHATCHAT_NEWS_POSTGRESQL_URL: ${NEWS_POSTGRESQL_URL:-jdbc:postgresql://postgresql:5432/chatchat_news}
      CHATCHAT_NEWS_POSTGRESQL_USERNAME: ${NEWS_POSTGRESQL_USERNAME:-chatchat_news}
      CHATCHAT_RUNTIME_NEWS_OPENSEARCH_ENABLED: 'true'
      CHATCHAT_RUNTIME_NEWS_OPENSEARCH_ENDPOINT: ${NEWS_OPENSEARCH_ENDPOINT:-https://opensearch:9200}
      CHATCHAT_RUNTIME_NEWS_OPENSEARCH_USERNAME: ${NEWS_OPENSEARCH_USERNAME:-admin}
      CHATCHAT_RUNTIME_NEWS_OPENSEARCH_INSECURESSL: 'false'
      CHATCHAT_RUNTIME_NEWS_WEBSEARCH_ENABLED: 'true'
      CHATCHAT_RUNTIME_NEWS_WEBSEARCH_CACHE_ENABLED: 'true'
      CHATCHAT_INTERNALCREDENTIAL_CRYPTOKEYFILE: /run/secrets/news_internal_key
      CHATCHAT_RUNTIME_NEWS_MCP_SERVER_BASE_URL: http://mcp:8090
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ${NEWS_DATA_DIR:?Set NEWS_DATA_DIR to the existing News data directory}
        target: /srv/app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${NEWS_CONFIG_DIR:?Set NEWS_CONFIG_DIR to the existing News config directory}
        target: /srv/app/config
        read_only: true
        bind:
          create_host_path: false
      - ${STAGE_ROOT}/news/logs:/srv/app/logs
      - ./service-healthcheck.sh:/opt/runtime/service-healthcheck.sh:ro
      - type: bind
        source: ${OPENSEARCH_TRUSTSTORE_FILE}
        target: /run/runtime-truststore.p12
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - source: postgresql_news_password
        target: CHATCHAT_NEWS_POSTGRESQL_PASSWORD
      - source: opensearch_admin_password
        target: chatchat.runtime.news.open-search.password
      - source: news_internal_key
        target: news_internal_key
      - source: internal_credential_encrypted
        target: chatchat.internal-credential.encrypted-secret
      - source: wsa_secret_id
        target: chatchat.runtime.news.web-search.secret-id
      - source: wsa_secret_key
        target: chatchat.runtime.news.web-search.secret-key
    networks:
      - control
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2

  coding-agent:
    image: ${NODE_IMAGE:?Set NODE_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, --input-type=module, -e, "import {readFileSync} from 'node:fs'; const secret=readFileSync(process.env.RUNTIME_CODING_SHARED_SECRET_FILE,'utf8').trim(); fetch('http://127.0.0.1:3100/healthz',{headers:{Authorization:'Bearer '+secret}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      NODE_ENV: production
      CLINE_NATIVE_SDK_ENABLED: ${CODING_NATIVE_SDK_ENABLED:-true}
      RUNTIME_CODING_HOST: 0.0.0.0
      RUNTIME_CODING_PORT: "3100"
      RUNTIME_CODING_CALLBACK_URL: ${CODING_CALLBACK_URL:-http://api:8080}
      RUNTIME_CODING_ALLOWED_CALLBACK_HOSTS: ${CODING_CALLBACK_ALLOWED_HOSTS:-api}
      RUNTIME_CODING_SHARED_SECRET_FILE: /run/secrets/coding_agent_shared_secret
      RUNTIME_CODING_MONITOR_TOKEN_FILE: /run/secrets/coding_node_monitor
      RUNTIME_CODING_MONITOR_DIRECTORY: /srv/monitor-data
      RUNTIME_CODING_MONITOR_SECURE_COOKIE: ${CODING_MONITOR_SECURE_COOKIE:-false}
    secrets:
      - source: coding_agent_node_secret
        target: coding_agent_shared_secret
      - source: coding_monitor_token
        target: coding_node_monitor
    volumes:
      - coding-monitor-data:/srv/monitor-data
    networks:
      coding: {}
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev,uid=1000,gid=32101
    user: "1000:32101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2

  node-proxy:
    image: ${NODE_PROXY_IMAGE:?Set NODE_PROXY_IMAGE}
    restart: unless-stopped
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
      coding-agent:
        condition: service_healthy
    volumes:
      - ${STAGE_ROOT}/config/node-proxy.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev,uid=101,gid=101
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25

  gateway:
    image: ${NODE_PROXY_IMAGE:?Set NODE_PROXY_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      node-proxy:
        condition: service_started
    ports:
      - ${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${RUNTIME_HTTP_PORT:-18100}:8080
      - ${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${MCP_HTTP_PORT:-18101}:8090
    volumes:
      - ${STAGE_ROOT}/config/public-gateway.conf:/etc/nginx/nginx.conf:ro
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,uid=101,gid=101
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5

secrets:
  postgresql_admin_password:
    file: ${POSTGRESQL_ADMIN_PASSWORD_FILE:?Set POSTGRESQL_ADMIN_PASSWORD_FILE}
  postgresql_api_password:
    file: ${POSTGRESQL_API_PASSWORD_FILE:?Set POSTGRESQL_API_PASSWORD_FILE}
  postgresql_mcp_password:
    file: ${POSTGRESQL_MCP_PASSWORD_FILE:?Set POSTGRESQL_MCP_PASSWORD_FILE}
  postgresql_news_password:
    file: ${NEWS_DATABASE_PASSWORD_FILE:?Set NEWS_DATABASE_PASSWORD_FILE}
  news_internal_key:
    file: ${NEWS_INTERNAL_KEY_FILE:?Set NEWS_INTERNAL_KEY_FILE}
  internal_credential_encrypted:
    file: ${INTERNAL_CREDENTIAL_ENCRYPTED_FILE:?Set INTERNAL_CREDENTIAL_ENCRYPTED_FILE}
  wsa_secret_id:
    file: ${WSA_SECRET_ID_FILE:?Set WSA_SECRET_ID_FILE}
  wsa_secret_key:
    file: ${WSA_SECRET_KEY_FILE:?Set WSA_SECRET_KEY_FILE}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?Set REDIS_PASSWORD_FILE}
  opensearch_admin_password:
    file: ${OPENSEARCH_ADMIN_PASSWORD_FILE:?Set OPENSEARCH_ADMIN_PASSWORD_FILE}
  bootstrap_admin_password:
    file: ${BOOTSTRAP_ADMIN_PASSWORD_FILE:?Set BOOTSTRAP_ADMIN_PASSWORD_FILE}
  api_internal_key:
    file: ${API_INTERNAL_KEY_FILE:?Set API_INTERNAL_KEY_FILE}
  mcp_internal_key:
    file: ${MCP_INTERNAL_KEY_FILE:?Set MCP_INTERNAL_KEY_FILE}
  coding_agent_shared_secret:
    file: ${CODING_AGENT_SHARED_SECRET_FILE:?Set CODING_AGENT_SHARED_SECRET_FILE}
  coding_agent_node_secret:
    file: ${CODING_AGENT_NODE_SECRET_FILE:?Set CODING_AGENT_NODE_SECRET_FILE}
  coding_monitor_token:
    file: ${CODING_MONITOR_TOKEN_FILE:?Set a separate read-only CODING_MONITOR_TOKEN_FILE}

volumes:
  postgresql-data:
  redis-data:
  opensearch-data:
  coding-monitor-data:

networks:
  control:
  coding:
    internal: true
