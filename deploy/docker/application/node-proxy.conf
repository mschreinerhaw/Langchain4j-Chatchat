worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  client_max_body_size 1m;
  # Worker callbacks have no route to general API, MCP, search or database endpoints.
  # The host firewall must allow this port only, not Java's port 8080.
  server {
    listen 8081;
    client_max_body_size 4m;
    proxy_read_timeout 24h;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_next_upstream off;
    location ~ ^/internal/coding/cline/(preflight|reserve-model|model|settle-model|prepare-python|execute-python|get-python|cancel-python|input-context|input-read|submit-report|read-artifact|read-skill|validate-sql|workspace-read|workspace-propose|checkpoint|event|finish)$ {
      limit_except POST { deny all; }
      proxy_pass http://127.0.0.1:8080;
    }
    location / { return 404; }
  }
  server {
    listen 127.0.0.1:8791;
    proxy_read_timeout 300s;
    location / {
      set $coding_agent_endpoint coding-agent:3100;
      proxy_pass http://$coding_agent_endpoint;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_next_upstream off;
    }
  }
  # Gateway-only monitor entry. Execution routes remain on Java's loopback port.
  server {
    listen 8792;
    absolute_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    location = /monitor {
      set $monitor_endpoint coding-agent:3100;
      proxy_pass http://$monitor_endpoint;
    }
    location ^~ /monitor/ {
      set $monitor_endpoint coding-agent:3100;
      proxy_pass http://$monitor_endpoint;
    }
    location = /v1/monitor {
      set $monitor_endpoint coding-agent:3100;
      proxy_pass http://$monitor_endpoint;
    }
    location ^~ /v1/monitor/ {
      set $monitor_endpoint coding-agent:3100;
      proxy_pass http://$monitor_endpoint;
    }
    location / { return 404; }
  }
}
