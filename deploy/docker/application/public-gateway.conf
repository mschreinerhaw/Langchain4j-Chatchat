worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 60m;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 1800s;
  proxy_send_timeout 1800s;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  server {
    listen 8080;
    set $api_endpoint api:8080;
    absolute_redirect off;
    location = /admin { return 302 /; }
    location = /admin/ { return 302 /; }
    location = /admin/index.html { return 302 /; }
    location = /favicon.ico { return 302 /lingdong-insight-mark.svg; }
    location = /monitor {
      set $monitor_endpoint api:8792;
      proxy_pass http://$monitor_endpoint;
    }
    location ^~ /monitor/ {
      set $monitor_endpoint api:8792;
      proxy_pass http://$monitor_endpoint;
    }
    location = /v1/monitor {
      set $monitor_endpoint api:8792;
      proxy_pass http://$monitor_endpoint;
    }
    location ^~ /v1/monitor/ {
      set $monitor_endpoint api:8792;
      proxy_pass http://$monitor_endpoint;
    }
    location = / {
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store, max-age=0" always;
      proxy_pass http://$api_endpoint;
    }
    location = /index.html {
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store, max-age=0" always;
      proxy_pass http://$api_endpoint;
    }
    location ^~ /internal/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location / { proxy_pass http://$api_endpoint; }
  }
  server {
    listen 8090;
    set $mcp_endpoint mcp:8090;
    location ^~ /internal/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location / { proxy_pass http://$mcp_endpoint; }
  }
}
