services:
  coding-agent:
    image: runtime-coding-agent:1.0
    build:
      context: ../../../coding-agent-node
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUNTIME_CODING_HOST: 0.0.0.0
      RUNTIME_CODING_PORT: "3100"
      RUNTIME_CODING_CALLBACK_URL: ${RUNTIME_CODING_CALLBACK_URL:?Set the Java Runtime callback URL}
      RUNTIME_CODING_ALLOWED_CALLBACK_HOSTS: ${RUNTIME_CODING_ALLOWED_CALLBACK_HOSTS:?Set the Java Runtime callback host}
      RUNTIME_CODING_SHARED_SECRET_FILE: /run/secrets/coding_agent_shared_secret
    secrets:
      - coding_agent_shared_secret
    ports:
      - "127.0.0.1:8791:3100"
    networks:
      coding_internal:
        ipv4_address: 172.30.91.10
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev,uid=1000,gid=32101
    user: "1000:32101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    dns:
      - 127.0.0.1
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const s=fs.readFileSync('/run/secrets/coding_agent_shared_secret','utf8').trim();fetch('http://127.0.0.1:3100/healthz',{headers:{Authorization:'Bearer '+s}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  coding_agent_shared_secret:
    file: ${CODING_AGENT_SHARED_SECRET_FILE:?Set an absolute path to a 32+ character secret file}

networks:
  coding_internal:
    ipam:
      config:
        - subnet: 172.30.91.0/24
