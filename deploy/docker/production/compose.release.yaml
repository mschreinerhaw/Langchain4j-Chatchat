# Install at /opt/runtime-os/compose.yaml on the production host.
# production-current points to the active release directory.
# Start: /opt/runtime-os/start-production.sh
# Stop:  docker compose -f /opt/runtime-os/compose.yaml stop -t 90
# Status: docker compose -f /opt/runtime-os/compose.yaml ps -a
# The startup script starts the existing shared containers before Compose.
name: runtime-os-source-production
include:
  - path:
      - ${RUNTIME_OS_RELEASE_DIR:-/opt/runtime-os/production-current}/compose.production.json
      - ${RUNTIME_OS_HOST_DEPENDENCIES_FILE:-${RUNTIME_OS_RELEASE_DIR:-/opt/runtime-os/production-current}/compose.host-dependencies.yaml}
      - ${RUNTIME_OS_PRODUCTION_STORAGE_FILE:-/opt/runtime-os/compose.production-storage.yaml}
      - ${RUNTIME_OS_NATIVE_DAEMON_FILE:-/opt/runtime-os/compose.native-daemon.yaml}
    project_directory: ${RUNTIME_OS_RELEASE_DIR:-/opt/runtime-os/production-current}
    env_file: ${RUNTIME_OS_RELEASE_DIR:-/opt/runtime-os/production-current}/private/release.env
