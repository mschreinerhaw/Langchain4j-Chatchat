events {}

http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 60m;

    server {
        listen 8080;
        set $api_endpoint api:8080;

        location = /version.json {
            default_type application/json;
            return 200 '{"release":"1.3.3"}';
        }

        location = /monitor { return 302 /monitor/index.html; }
        location = /monitor/ { return 302 /monitor/index.html; }
        location = /v1/monitor { return 302 /monitor/; }
        location ^~ /v1/monitor/ { return 302 /monitor/; }
        location ~ ^/monitor/(index\.html|app\.js|style\.css)$ {
            alias /srv/coding-monitor/$1;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ^~ /internal/ { return 404; }
        location ^~ /actuator/ { return 404; }
        location ~ ^/api/(login|logout|config|sessions|dispatches|inputs|assets)(/|$) { return 404; }
        location / { proxy_pass http://$api_endpoint; }
    }

    server {
        listen 8090;
        set $mcp_endpoint mcp:8090;
        location ^~ /internal/ { return 404; }
        location ^~ /actuator/ { return 404; }
        location / { proxy_pass http://$mcp_endpoint; }
    }
}
