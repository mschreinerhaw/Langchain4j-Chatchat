name: deployment-ops-node
services:
  executor:
    image: deployment-ops-executor:1.0.0
    pull_policy: never
    environment:
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?set token}
      OPS_NETWORK: deployment-ops-node_apps
      TLS_CERT: /tls/server.crt
      TLS_KEY: /tls/server.key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - node-state:/state
      - ./tls:/tls:ro
    ports: ["${NODE_BIND:?set private IP}:8091:8091"]
    networks: [apps]
    read_only: true
    tmpfs: ["/tmp:size=3g"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
networks:
  apps: {}
volumes:
  node-state:
