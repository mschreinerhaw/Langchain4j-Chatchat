spring:
  application:
    name: deployment-ops
  datasource:
    url: jdbc:h2:file:${OPS_DATA_DIR:/mnt/disk01/deployment-ops/data}/deployment-ops;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
    username: deployment_ops
    password: ${OPS_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 4
  h2:
    console:
      enabled: false
server:
  address: ${OPS_BIND:127.0.0.1}
  port: ${OPS_PORT:19240}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
