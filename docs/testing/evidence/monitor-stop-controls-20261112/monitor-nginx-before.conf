events { worker_connections 128; }
http { server { listen 18353; server_name _; client_max_body_size 65m; proxy_read_timeout 1300s; proxy_buffering off;
location = / { return 302 /monitor/; }
location = /monitor/app.js { default_type text/javascript; alias /etc/nginx/monitor-app.js; }
location = /monitor/style.css { default_type text/css; alias /etc/nginx/monitor-style.css; }
location /monitor { proxy_pass http://127.0.0.1:18180; }
location = /api/v1/enterprise/auth/login { proxy_pass http://127.0.0.1:18180; }
location = /api/v1/enterprise/auth/me { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18180; }
location /api/v1/coding-node-diagnostics/ { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18180; }
location /api/v1/coding/tasks { proxy_pass http://127.0.0.1:18180; }
location /api/v1/coding-monitor/ { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18180; }
location /api/v1/data-science/user-assets { proxy_pass http://127.0.0.1:18180; }
location /api/v1/interactions/user-assets { proxy_pass http://127.0.0.1:18180; }
location / { return 404; }
} }
