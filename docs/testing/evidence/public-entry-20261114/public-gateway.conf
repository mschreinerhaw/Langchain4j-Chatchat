worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 60m;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 1800s;
  proxy_send_timeout 1800s;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  server {
    listen 8080;
    set $api_endpoint api:8080;
    absolute_redirect off;
    location = /admin { return 302 /; }
    location = /admin/ { return 302 /; }
    location = /admin/index.html { return 302 /; }
    location = /favicon.ico { return 302 /lingdong-insight-mark.svg; }
    location = /monitor { return 302 /monitor/; }
    location = /monitor/ { rewrite ^ /monitor/index.html last; }
    location = /monitor/index.html { alias /srv/coding-monitor/index.html; default_type text/html; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /monitor/app.js { alias /srv/coding-monitor/app.js; default_type application/javascript; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /monitor/style.css { alias /srv/coding-monitor/style.css; default_type text/css; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /version.json { root /srv/task-lifecycle-ui; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /v1/monitor { return 302 /monitor/; }
    location ^~ /v1/monitor/ { return 302 /monitor/; }
    # Node management APIs are not exposed through the business gateway.
    location ~ ^/api/(login|logout|config|sessions|dispatches|inputs|assets)(/|$) { return 404; }
    location = / {
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store, max-age=0" always;
      add_header X-Runtime-Release "7ccfd561f-20261114" always;
      root /srv/task-lifecycle-ui; try_files /index.html =404;
    }
    location = /index.html {
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store, max-age=0" always;
      add_header X-Runtime-Release "7ccfd561f-20261114" always;
      root /srv/task-lifecycle-ui; try_files /index.html =404;
    }
    location ^~ /assets/ { root /srv/task-lifecycle-ui; try_files $uri @previous_assets; }
    location @previous_assets { proxy_pass http://$api_endpoint; }
    location ^~ /internal/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location / { proxy_pass http://$api_endpoint; }
  }
  server {
    listen 8090;
    set $mcp_endpoint mcp:8090;
    location ^~ /internal/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location / { proxy_pass http://$mcp_endpoint; }
  }
}
