services:
  llm-gateway:
    image: ${GATEWAY_IMAGE:-llm-compatibility-gateway:1.2.0-rc.1}
    pull_policy: never
    build:
      context: .
      args:
        GATEWAY_SOURCE_SHA: ${GATEWAY_SOURCE_SHA:-unknown}
    restart: unless-stopped
    init: true
    stop_grace_period: ${GATEWAY_STOP_GRACE_PERIOD:-35s}
    env_file: .env
    ports:
      - "${API_BIND:-127.0.0.1}:${HTTPS_PUBLIC_PORT:-8443}:${HTTPS_PORT:-8443}"
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PUBLIC_PORT:-18081}:${ADMIN_PORT:-18081}"
    volumes:
      - gateway-data:/app/data
      - gateway-logs:/app/logs
      - gateway-certs:/app/certs
      - "${TLS_BOOTSTRAP_HOST_DIR:-./tls-bootstrap}:/run/gateway-tls:ro"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  gateway-data:
  gateway-logs:
  gateway-certs:
