services:
  llm-gateway:
    image: ${GATEWAY_IMAGE:-llm-compatibility-gateway:1.0.0}
    pull_policy: never
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PUBLIC_PORT:-18080}:18080"
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PUBLIC_PORT:-18081}:18081"
    volumes:
      - gateway-data:/app/data
      - gateway-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  gateway-data:
  gateway-logs:
