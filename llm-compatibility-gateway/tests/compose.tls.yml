services:
  llm-gateway:
    environment:
      TLS_SERVER_NAMES: localhost,127.0.0.1,llm-gateway
      UPSTREAM_ALLOWED_ORIGINS: http://mock:19090,https://mock-tls:19443
    depends_on:
      - mock
      - mock-tls
  mock:
    image: node:24-bookworm-slim
    pull_policy: never
    user: node
    read_only: true
    volumes:
      - ./tests/mock.mjs:/fixture.mjs:ro
    command: ["node", "/fixture.mjs"]
  mock-tls:
    image: ${GATEWAY_IMAGE:-llm-compatibility-gateway:1.2.0-rc.1}
    pull_policy: never
    user: node
    read_only: true
    volumes:
      - ./tests/mock.mjs:/fixture.mjs:ro
      - ./local/tls:/fixture-tls:ro
    environment:
      FIXTURE_TLS_CERT: /fixture-tls/upstream.crt
      FIXTURE_TLS_KEY: /fixture-tls/upstream.key
      FIXTURE_PORT: 19443
    command: ["node", "/fixture.mjs"]
    healthcheck:
      disable: true
