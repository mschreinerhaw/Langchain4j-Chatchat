spring:
  config:
    # Database type selector: datasource-mysql.yml or datasource-h2.yml.
    import: datasource-h2.yml
  application:
    name: chatchat
    version: 1.0.0-SNAPSHOT
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    static-path-pattern: /**
    throw-exception-if-no-handler-found: true
  resources:
    add-mappings: false

server:
  port: 8080
  servlet:
    context-path: /
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 500
    max-http-form-post-size: 33554432
    max-swallow-size: -1
  error:
    include-stacktrace: never
    include-message: never

chatchat:
  data-science:
    workspace-root: ${CHATCHAT_PYTHON_WORKSPACE_ROOT:./data/python-assets}
    max-data-file-bytes: ${CHATCHAT_PYTHON_MAX_DATA_FILE_BYTES:52428800}
    data-cleanup-interval-ms: ${CHATCHAT_PYTHON_DATA_CLEANUP_INTERVAL_MS:3600000}
    docker-command: ${CHATCHAT_PYTHON_DOCKER_COMMAND:docker}
    default-image: ${CHATCHAT_PYTHON_DEFAULT_IMAGE:python:3.12-slim}
    cpu-limit: ${CHATCHAT_PYTHON_CPU_LIMIT:2}
    memory-limit: ${CHATCHAT_PYTHON_MEMORY_LIMIT:4g}
    timeout-seconds: ${CHATCHAT_PYTHON_TIMEOUT_SECONDS:300}
    output-limit-bytes: ${CHATCHAT_PYTHON_OUTPUT_LIMIT_BYTES:1000000}
    index-name: ${CHATCHAT_PYTHON_INDEX_NAME:mcp_python_template_index}
  audit:
    default-query-window-days: ${CHATCHAT_AUDIT_DEFAULT_QUERY_WINDOW_DAYS:7}
  ui-artifact:
    enabled: ${CHATCHAT_UI_ARTIFACT_ENABLED:true}
    # local and shared both use Java NIO. For shared mode, storage-path must be an OS-mounted NFSv4/SMB3/CephFS path.
    store-type: ${CHATCHAT_UI_ARTIFACT_STORE_TYPE:local}
    storage-path: ${CHATCHAT_UI_ARTIFACT_STORAGE_PATH:./data/ui-artifacts}
    shared-marker-file: ${CHATCHAT_UI_ARTIFACT_SHARED_MARKER:.chatchat-artifact-store}
    migrate-legacy-on-read: ${CHATCHAT_UI_ARTIFACT_MIGRATE_LEGACY_ON_READ:true}
    # Render every non-empty UI response through the governed artifact renderer by default.
    always-externalize: ${CHATCHAT_UI_ARTIFACT_ALWAYS_EXTERNALIZE:true}
    # Used only when always-externalize is false.
    externalize-threshold-bytes: ${CHATCHAT_UI_ARTIFACT_THRESHOLD_BYTES:131072}
    answer-preview-characters: ${CHATCHAT_UI_ARTIFACT_PREVIEW_CHARACTERS:4000}
    ttl-seconds: ${CHATCHAT_UI_ARTIFACT_TTL_SECONDS:2592000}
    cleanup-interval-ms: ${CHATCHAT_UI_ARTIFACT_CLEANUP_INTERVAL_MS:3600000}
  http:
    json-request:
      enabled: ${CHATCHAT_JSON_REQUEST_LIMIT_ENABLED:true}
      max-bytes: ${CHATCHAT_JSON_REQUEST_MAX_BYTES:2097152}
      warning-bytes: ${CHATCHAT_JSON_REQUEST_WARNING_BYTES:524288}
  internal-credential:
    enabled: true
    username: chatchat_mcp_internal
    encrypted-secret: "ENC(RJGDk0FA9Xht7fHK:VBpgvsk5UR2XGCoSxNL7eqlS0Lu4r2UG1U6vvQ6NM7KBEwQ6/5j09M/A+mdijO9H)"
    crypto-key-file: ./config/internal-credential.key
  mcp:
    capabilities:
      news:
        enabled: true
        tools:
          web_search: { enabled: true, agent-callable: true, timeout: 30s }
    center:
      enabled: true
      base-url: http://localhost:8090
      admin-username: chatchat_mcp_internal
      encrypted-admin-password: "${CHATCHAT_API_MCP_ENCRYPTED_PASSWORD:${chatchat.internal-credential.encrypted-secret:}}"
      admin-login-path: /api/v1/admin/auth/login
      service-list-path: /api/v1/mcp-services
      mcp-endpoint: /mcp
      standalone-service-id: chatchat-mcp-server
      standalone-service-name: ChatChat MCP Server
      encrypted-invocation-token: "${CHATCHAT_API_MCP_ENCRYPTED_INVOCATION_TOKEN:${chatchat.internal-credential.encrypted-secret:}}"
      timeout-ms: 90000
      import-standalone-server: true
    stdio-proxy:
      enabled: true
      max-sessions: 32
      request-timeout-ms: 0
      startup-timeout-ms: 15000
      idle-ttl-ms: 300000
      cleanup-interval-ms: 30000
      command-allow-list:
        - npx
        - node
        - uvx
        - python
        - python3
  models:
    defaultChatModel: qwen3.6-plus
    availableChatModels:
      - deepseek-v4-pro
    context-window-max-tokens: 200000
    context-reserved-system-tokens: 20000
    context-reserved-history-tokens: 30000
    context-reserved-output-tokens: 30000
    timeout: 1800000
    openai:
      apiKey:
      baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
      # auto detects OpenAI-compatible URLs and DashScope native generation endpoints.
      protocol: auto
      timeout: 1800000
      # Maximum model completion tokens. -1 means do not set a model-side token limit.
      maxTokens: -1
      maxRetries: 3
      proxy:
        enabled: false
        host:
        port: 0
        type: http
  agent-runtime:
    store-type: rocksdb
    rocks-db-path: ./data/agent-runtime-rocksdb
    rocks-db-create-if-missing: true
    fail-interrupted-runs-on-startup: true
    evidence-externalization-enabled: true
    evidence-externalization-threshold-bytes: 262144
    max-stored-runs: 10000
    # Terminal runs and their OpenSearch evidence are retained for 7 days.
    terminal-run-ttl-ms: 604800000
    cleanup-enabled: true
    cleanup-interval-ms: 3600000
    cleanup-initial-delay-ms: 60000
    final-summary-web-search-enabled: true
    final-summary-web-search-max-keywords: 2
    final-summary-web-search-result-limit: 6
    final-summary-web-search-evidence-max-chars: 16000
    final-summary-web-search-timeout-ms: 120000
    # Lossless processing boundaries; these values never truncate returned evidence.
    record-analysis-chunk-max-chars: ${CHATCHAT_AGENT_RECORD_ANALYSIS_CHUNK_MAX_CHARS:12000}
    record-analysis-chunk-max-rows: ${CHATCHAT_AGENT_RECORD_ANALYSIS_CHUNK_MAX_ROWS:50}
    analysis-summary-worker-count: ${CHATCHAT_AGENT_ANALYSIS_SUMMARY_WORKER_COUNT:4}
    analysis-summary-task-timeout-ms: ${CHATCHAT_AGENT_ANALYSIS_SUMMARY_TASK_TIMEOUT_MS:180000}
    analysis-spill-enabled: ${CHATCHAT_AGENT_ANALYSIS_SPILL_ENABLED:true}
    analysis-spill-rocks-db-path: ${CHATCHAT_AGENT_ANALYSIS_SPILL_ROCKSDB_PATH:./data/agent-analysis-spill-rocksdb}
    analysis-spill-rocks-db-create-if-missing: true
    analysis-spill-threshold-bytes: ${CHATCHAT_AGENT_ANALYSIS_SPILL_THRESHOLD_BYTES:65536}
    analysis-spill-ttl-ms: ${CHATCHAT_AGENT_ANALYSIS_SPILL_TTL_MS:604800000}
  agent:
    task:
      queue-capacity: 1000
      core-pool-size: 16
      max-pool-size: 16
      max-concurrent-tasks-per-tenant: 4
      execution-timeout-ms: 0
      keep-alive-seconds: 60
      list-limit: 50
      event-store:
        type: rocksdb
        path: ./data/agent-event-rocksdb
        create-if-missing: true
  search:
    store-path: ./data/search-rocksdb
    file-path: ./data/search-files
    create-if-missing: true
    max-upload-bytes: 5242880
    default-limit: 20
    max-limit: 100
    summary-length: 180
    # Startup full index rebuild is slow when documents grow. Upload/update/delete already syncs indexes incrementally.
    # Set true only when local Lucene/OpenSearch index files were lost or need manual repair.
    rebuild-on-startup: false
    # 文档检索引擎：
    # - lucene：默认值，使用本机磁盘索引，适合本地开发、单机快速部署。
    # - opensearch：使用远程 OpenSearch 集群，适合多实例共享索引或生产集中检索。
    # 启动脚本传 --search-engine=opensearch 会覆盖这里的配置。
    engine: lucene
    # 仅当 engine=opensearch 时生效。API 文档检索会把上传文档分片写入这个索引。
    opensearch:
      # false 表示即使 engine=opensearch 也不连接 OpenSearch，会回退到本地 Lucene。
      enabled: true
      # OpenSearch HTTPS 地址，支持带路径前缀但不要以 / 结尾。
      url: ${CHATCHAT_OPENSEARCH_URL:https://127.0.0.1:9200}
      username: ${CHATCHAT_OPENSEARCH_USERNAME:admin}
      password: ${CHATCHAT_OPENSEARCH_PASSWORD:}
      # API 文档检索使用的索引名。
      index-name: chatchat_documents
      # 使用自签名 HTTPS 证书时设为 true；正式公网证书建议保持 false。
      insecure-ssl: true
      connect-timeout-ms: 5000
      request-timeout-ms: 30000
      # 重建索引时每批写入的文档分片数量。
      bulk-batch-size: 200
      max-query-terms: 20
      max-query-chars: 500
      max-permission-roles: 64
      log-query-dsl: false
      embedding:
        request-timeout-ms: 300000
        # 向量增强检索开关。开启后写入 contentVector，并在查询时做 BM25 + KNN 融合。
        # 如果当前 OpenSearch 没有 knn_vector 能力，会自动降级为 BM25 候选集的向量重排。
        enabled: true
        # 阿里云百炼/DashScope OpenAI compatible embeddings 地址，替换 {WorkspaceId} 后使用。
        endpoint: https://llm-7upawl16up8649rh.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/embeddings
        # 百炼 API Key。生产部署请在外部配置文件中填入；不要提交真实密钥。
        api-key: ${CHATCHAT_EMBEDDING_API_KEY:}
        model: text-embedding-v4
        # text-embedding-v4 默认按 1024 维建 knn_vector；如果模型输出维度变化，只需要改这里并重建索引。
        dimension: 1024
        vector-field: contentVector
        max-input-chars: 6000
        vector-candidate-limit: 50
        # 融合排序权重：关键词、向量、标题/章节命中、位置新鲜度、公开/租户可见度。
        bm25-weight: 0.45
        vector-weight: 0.35
        title-weight: 0.10
        freshness-weight: 0.05
        authority-weight: 0.05
    fallback-candidate-limit: 500
    fallback-empty-result-limit: 200
    fallback-exception-limit: 100
    lucene-max-query-terms: 80
    lucene-max-negative-query-terms: 24
    lucene-mmr-candidate-limit: 120
    realtime-document-count-enabled: false
    query-budget:
      max-doc-scan: 1000
      max-rocksdb-iter: 2000
    retrieval-control:
      enabled: true
      query-validation-enabled: true
      quality-scoring-enabled: true
      max-search-calls: 1
      max-attempts: 1
      latency-ms: 100
      min-quality-score: 20.0
      min-specific-tokens: 2
    ocr:
      enabled: true
      language: eng+chi_sim
      timeout-seconds: 60
      preserve-interword-spacing: true
      image-preprocessing-enabled: true
      pdf-strategy: auto
      marker: "# OCR_TEXT"
      score-penalty: 0.7
  chat:
    defaultTimeout: 30
    streamingTimeout: 300
    # User message length limit. -1 means unlimited when enforced by clients.
    maxMessageLength: 4096
    conversationHistorySize: 20
    context:
      recent-message-limit: 8
      summary-trigger-messages: 12
      summary-keep-recent-messages: 6
      # Conversation summary character limit. -1 means unlimited.
      summary-max-chars: 1600
      summary-enabled: true
    detail-store:
      type: rocksdb
      path: ./data/chat-rocksdb
      create-if-missing: true
      # Allows existing tool traces containing large results to remain readable.
      max-string-length: 100000000
      external-text:
        enabled: true
        index-name: chatchat_chat_details
        migrate-legacy-on-read: true
  api:
    limits:
      # Frontend search result chunk count. -1 means unlimited.
      search-result-max-chunks: 3
      # Frontend search result chunk character limit. -1 means unlimited.
      search-result-chunk-max-chars: 1200
      # Frontend search result summary character limit. -1 means unlimited.
      search-result-summary-max-chars: 800
  tools:
    calculator:
      risk-level: low
      operation-type: read
      timeout-ms: 5000
      confirmation:
        default: auto_execute
      parameter-policy:
        expression: auto_execute
    document-search:
      enabled: true
      # Runtime/API retrieval service address. For the standalone MCP Server, point this to the Runtime/API host.
      api-base-url: http://localhost:8080
      search-path: /api/v1/search/document-search
      detail-path-template: /api/v1/search/documents/{docId}
      timeout-ms: 300000
      default-limit: 5
      max-limit: 20
      auth:
        enabled: true
        login-path: /api/v1/enterprise/auth/login
        username:
        password:
        bearer-token: ""
      risk-level: medium
      confirmation:
        default: ask_before_execute
    database-query:
      risk-level: high
      operation-type: read
      user-visible: false
      agent-compatible: false
      confirmation:
        default: ask_before_execute
      parameter-policy:
        jdbc-url: ask_before_execute
        password: ask_before_execute
      driver-lib-path: ./lib/drivers
    file-system:
      risk-level: high
      operation-type: read
      timeout-ms: 10000
      confirmation:
        default: ask_before_execute
      parameter-policy:
        path: ask_before_execute
  tool-runtime:
    enforce-allowed-tools: true
    enforce-authentication: true
    default-max-calls-per-minute: 0
    circuit-breaker-failure-threshold: 3
    circuit-breaker-open-seconds: 60
    top-tool-limit: 6
    default-tool-timeout-ms: 1800000
    execution-core-pool-size: 4
    execution-max-pool-size: 32
    execution-queue-capacity: 256
    max-output-bytes: ${CHATCHAT_TOOL_MAX_OUTPUT_BYTES:262144}
    max-output-preview-chars: ${CHATCHAT_TOOL_MAX_OUTPUT_PREVIEW_CHARS:16000}

mcp-policy:
  enabled: true
  risk-policy:
    low: auto_execute
    medium: ask_before_execute
    high: ask_before_execute
    forbidden: deny
  tool-policy:
    calculator: auto_execute
    query_dictionary: auto_execute
    web_search: auto_execute
    document_search: ask_before_execute
    database_query: ask_before_execute
    file_system: ask_before_execute
    send_email: ask_before_execute
    delete_record: deny
  parameter-policy:
    send_email:
      recipient_count_gt_10: ask_before_execute
      external_domain: ask_before_execute
    execute_sql:
      contains_delete: deny
      contains_update: ask_before_execute
      contains_drop: deny
    query_customer_asset:
      customer_detail: ask_before_execute
      branch_summary: auto_execute
    calculator:
      expression: auto_execute
    web_search:
      query: auto_execute
    document_search:
      document_ids: ask_before_execute
      tags: auto_execute
    database_query:
      contains_delete: deny
      contains_update: ask_before_execute
      contains_drop: deny
      jdbc_url: ask_before_execute
      password: ask_before_execute
    file_system:
      operation: ask_before_execute
      path: ask_before_execute

mcp-workflow:
  enabled: true
  workflows:
    customer_asset_analysis:
      execution-strategy:
        mode: sequential
        stop-on-error: true
        max-steps: 6
        allow-parallel: false
      steps:
        - step: 1
          tool: get_user_permission
          required: true
        - step: 2
          tool: query_customer_basic_info
          required: true
        - step: 3
          tool: query_customer_asset_summary
          required: true
          confirmation: ask_before_execute
        - step: 4
          tool: query_customer_position_detail
          required: false
          depends-on:
            - query_customer_basic_info
            - query_customer_asset_summary
        - step: 5
          tool: query_high_value_customer_profile
          required: false
          condition: asset_total > 1000000
        - step: 6
          tool: generate_analysis_report
          required: true
          depends-on:
            - query_customer_asset_summary
  tool-dependencies:
    query_customer_position_detail:
      depends-on:
        - query_customer_basic_info
        - query_customer_asset_summary
    generate_analysis_report:
      depends-on:
        - query_customer_asset_summary

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  use-fqn: false

logging:
  config: file:./config/logback-spring.xml
  file:
    name: ./logs/chatchat.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
  level:
    com.chatchat: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
