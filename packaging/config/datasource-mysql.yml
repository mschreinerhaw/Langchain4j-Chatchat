spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${CHATCHAT_API_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/live_runtime_api?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${CHATCHAT_API_MYSQL_USERNAME:chatchat_api}
    password: ${CHATCHAT_API_MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

chatchat:
  datasource-migration:
    enabled: false
    source-url: jdbc:h2:file:./data/h2/chatchat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    source-driver-class-name: org.h2.Driver
    source-username: sa
    source-password:
    replace-existing: false
    batch-size: 500
