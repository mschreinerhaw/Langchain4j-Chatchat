spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: "${CHATCHAT_API_POSTGRESQL_URL:jdbc:postgresql://127.0.0.1:5432/live_runtime_api}"
    driver-class-name: org.postgresql.Driver
    username: ${CHATCHAT_API_POSTGRESQL_USERNAME:chatchat_api}
    password: ${CHATCHAT_API_POSTGRESQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${CHATCHAT_API_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${CHATCHAT_API_DB_MIN_IDLE:5}
      connection-timeout: ${CHATCHAT_API_DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${CHATCHAT_API_DB_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${CHATCHAT_API_DB_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${CHATCHAT_API_DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${CHATCHAT_API_DB_KEEPALIVE_MS:30000}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
