# Environment template for bin/start.sh and bin/start.bat.
# Put machine-specific secrets in config/env.local; it is intentionally ignored by git.
# Leave SPRING_PROFILES_ACTIVE unset to use spring.profiles.default from config/application.yml.
# SPRING_PROFILES_ACTIVE=dev

# Runtime database/search mode is controlled by application-*.yml.
# Copy one of the application-*.template presets to the active application file when switching modes.
# Set CHATCHAT_DATASOURCE_MIGRATION_ENABLED=true once to copy H2 data into an empty MySQL schema.
CHATCHAT_DATASOURCE_MIGRATION_ENABLED=false

# Set true when OpenSearch uses a self-signed certificate or an IP address not listed in the certificate SAN.
# Set false when OpenSearch uses a trusted certificate and hostname.
CHATCHAT_OPENSEARCH_INSECURE_SSL=true

# application-dev.yml overrides.
# Spring resolves both YAML dots and dashes as underscores in environment names.
CHATCHAT_INTERNAL_CREDENTIAL_CRYPTO_KEY=
CHATCHAT_INTERNAL_CREDENTIAL_CRYPTO_KEY_FILE=

CHATCHAT_MODELS_OPENAI_API_KEY=
CHATCHAT_MODELS_OPENAI_PROXY_ENABLED=false
CHATCHAT_MODELS_OPENAI_PROXY_HOST=
CHATCHAT_MODELS_OPENAI_PROXY_PORT=0
CHATCHAT_MODELS_OPENAI_PROXY_TYPE=http
CHATCHAT_MODELS_CONTEXT_WINDOW_MAX_TOKENS=200000
CHATCHAT_MODELS_CONTEXT_RESERVED_SYSTEM_TOKENS=20000
CHATCHAT_MODELS_CONTEXT_RESERVED_HISTORY_TOKENS=30000
CHATCHAT_MODELS_CONTEXT_RESERVED_OUTPUT_TOKENS=30000

CHATCHAT_AGENT_RUNTIME_EVIDENCE_EXTERNALIZATION_ENABLED=true
CHATCHAT_AGENT_RUNTIME_EVIDENCE_EXTERNALIZATION_THRESHOLD_BYTES=262144
CHATCHAT_AGENT_RUNTIME_TERMINAL_RUN_TTL_MS=604800000
CHATCHAT_AGENT_RUNTIME_CLEANUP_ENABLED=true
CHATCHAT_AGENT_RUNTIME_CLEANUP_INTERVAL_MS=3600000
CHATCHAT_AGENT_RUNTIME_CLEANUP_INITIAL_DELAY_MS=60000
CHATCHAT_AGENT_RUNTIME_FINAL_SUMMARY_WEB_SEARCH_ENABLED=true
CHATCHAT_AGENT_RUNTIME_FINAL_SUMMARY_WEB_SEARCH_MAX_KEYWORDS=2
CHATCHAT_AGENT_RUNTIME_FINAL_SUMMARY_WEB_SEARCH_RESULT_LIMIT=6
CHATCHAT_AGENT_RUNTIME_FINAL_SUMMARY_WEB_SEARCH_EVIDENCE_MAX_CHARS=16000
CHATCHAT_AGENT_RUNTIME_FINAL_SUMMARY_WEB_SEARCH_TIMEOUT_MS=120000

CHATCHAT_SEARCH_OPENSEARCH_PASSWORD=
CHATCHAT_SEARCH_OPENSEARCH_MAX_QUERY_TERMS=20
CHATCHAT_SEARCH_OPENSEARCH_MAX_QUERY_CHARS=500
CHATCHAT_SEARCH_OPENSEARCH_MAX_PERMISSION_ROLES=64
CHATCHAT_SEARCH_OPENSEARCH_LOG_QUERY_DSL=true
CHATCHAT_SEARCH_OPENSEARCH_EMBEDDING_API_KEY=

CHATCHAT_CHAT_DETAIL_STORE_PATH=./data/chat-rocksdb
CHATCHAT_AGENT_RUNTIME_ROCKS_DB_PATH=./data/agent-runtime-rocksdb
CHATCHAT_AGENT_TASK_EVENT_STORE_PATH=./data/agent-event-rocksdb
CHATCHAT_SEARCH_STORE_PATH=./data/search-rocksdb
CHATCHAT_SEARCH_FILE_PATH=./data/search-files

# API server and profile-sensitive datasource. Leave datasource values empty to use application-*.yml defaults.
SERVER_PORT=8080
SERVER_TOMCAT_CONNECTION_TIMEOUT=30m
SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT=30m
SPRING_MVC_ASYNC_REQUEST_TIMEOUT=1800000
SPRING_DATASOURCE_URL=
SPRING_DATASOURCE_USERNAME=
SPRING_DATASOURCE_PASSWORD=

# Internal API/MCP credential.
CHATCHAT_INTERNAL_CREDENTIAL_USERNAME=chatchat_mcp_internal
CHATCHAT_INTERNAL_CREDENTIAL_ENCRYPTED_SECRET=
CHATCHAT_INTERNAL_CREDENTIAL_SECRET=chatchat_internal_default_secret

# MCP center connection and recovery.
CHATCHAT_MCP_CAPABILITIES_NEWS_ENABLED=true
CHATCHAT_MCP_CENTER_ENABLED=true
CHATCHAT_MCP_CENTER_BASE_URL=http://localhost:8090
CHATCHAT_MCP_CENTER_ADMIN_USERNAME=chatchat_mcp_internal
CHATCHAT_MCP_CENTER_ENCRYPTED_ADMIN_PASSWORD=
CHATCHAT_MCP_CENTER_ADMIN_PASSWORD=chatchat_internal_default_secret
CHATCHAT_MCP_CENTER_ENCRYPTED_INVOCATION_TOKEN=
CHATCHAT_MCP_CENTER_INVOCATION_TOKEN=chatchat_internal_default_secret
CHATCHAT_MCP_CENTER_TIMEOUT_MS=1800000
CHATCHAT_MCP_CENTER_AUTO_RECOVERY_ENABLED=true
CHATCHAT_MCP_CENTER_HEARTBEAT_INITIAL_DELAY_MS=10000
CHATCHAT_MCP_CENTER_HEARTBEAT_INTERVAL_MS=15000
CHATCHAT_MCP_CENTER_HEARTBEAT_TIMEOUT_MS=5000
CHATCHAT_MCP_CENTER_MAX_AUTO_SYNC_ATTEMPTS=5

# Model and agent execution.
CHATCHAT_MODELS_DEFAULT_CHAT_MODEL=deepseek-v4-pro
CHATCHAT_MODELS_AVAILABLE_CHAT_MODELS_0=deepseek-v4-pro
CHATCHAT_MODELS_OPENAI_BASE_URL=
CHATCHAT_MODELS_OPENAI_TIMEOUT=1800000
CHATCHAT_MODELS_OPENAI_MAX_TOKENS=-1
CHATCHAT_MODELS_OPENAI_MAX_RETRIES=3
CHATCHAT_AGENT_TASK_QUEUE_CAPACITY=1000
CHATCHAT_AGENT_TASK_CORE_POOL_SIZE=16
CHATCHAT_AGENT_TASK_MAX_POOL_SIZE=16
CHATCHAT_AGENT_TASK_MAX_CONCURRENT_TASKS_PER_TENANT=4
CHATCHAT_AGENT_TASK_EXECUTION_TIMEOUT_MS=3600000
CHATCHAT_TOOL_RUNTIME_DEFAULT_TOOL_TIMEOUT_MS=1800000
CHATCHAT_TOOL_RUNTIME_MAX_BATCH_CALLS=32
CHATCHAT_TOOL_RUNTIME_MAX_BATCH_PAYLOAD_BYTES=262144

# API document search and OpenSearch.
CHATCHAT_TOOLS_DOCUMENT_SEARCH_API_BASE_URL=http://localhost:8080
CHATCHAT_TOOLS_DOCUMENT_SEARCH_AUTH_USERNAME=chatchat_mcp_internal
CHATCHAT_TOOLS_DOCUMENT_SEARCH_AUTH_ENCRYPTED_PASSWORD=
CHATCHAT_TOOLS_DOCUMENT_SEARCH_AUTH_PASSWORD=chatchat_internal_default_secret
CHATCHAT_TOOLS_DOCUMENT_SEARCH_AUTH_BEARER_TOKEN=
CHATCHAT_SEARCH_OPENSEARCH_URL=
CHATCHAT_SEARCH_OPENSEARCH_USERNAME=
CHATCHAT_SEARCH_OPENSEARCH_INDEX_NAME=chatchat_documents
CHATCHAT_SEARCH_OPENSEARCH_INSECURE_SSL=true
CHATCHAT_SEARCH_OPENSEARCH_EMBEDDING_ENABLED=false
CHATCHAT_SEARCH_OPENSEARCH_EMBEDDING_ENDPOINT=
CHATCHAT_SEARCH_OPENSEARCH_EMBEDDING_MODEL=text-embedding-v4
CHATCHAT_SEARCH_OPENSEARCH_EMBEDDING_DIMENSION=1024
