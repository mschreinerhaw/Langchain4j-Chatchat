<script>
const SKILLS=[
{id:'knowledge',name:'业务知识解答',emoji:'📖',cmd:'/知识问答',desc:'解释固收术语、业务指标和常见规则',sample:'什么是 DV01？请结合债券组合举例解释。',steps:['检索已授权业务知识条目','整理指标解释与适用场景','返回示例及注意事项']},
{id:'guide',name:'岗位工作指引',emoji:'🗓',cmd:'/岗位指引',desc:'引导新人开展每日、每周岗位工作',sample:'我刚入职固收部门，今天应该做哪些工作？',steps:['识别岗位与工作日期','参考岗位检查清单','生成分步骤工作指引']},
{id:'operation',name:'系统操作指导',emoji:'🧭',cmd:'/系统指导',desc:'解释系统菜单、查询路径及字段含义',sample:'在业务系统里如何查看组合持仓？',steps:['匹配系统操作说明','定位查询菜单及字段','生成操作步骤与提醒']},
{id:'data',name:'自然语言查数据',emoji:'▦',cmd:'/数据查询',desc:'调用已授权数据接口查询持仓、收益和行情',sample:'查询组合 A 最近三天的收益、持仓和久期。',steps:['识别组合、指标与时间范围','校验数据范围与访问权限（模拟）','调用 LiveData API / MCP（模拟）','整理数据和来源信息']},
{id:'analysis',name:'数据解读与分析辅助',emoji:'📈',cmd:'/数据分析',desc:'解释指标变化，指导核查异常原因',sample:'组合收益下降了，应该怎么分析原因？',steps:['确认分析问题和数据口径','对比指标及历史趋势（模拟）','归纳待核实因素并标注局限']},
{id:'process',name:'操作流程与规范指导',emoji:'☑',cmd:'/流程规范',desc:'提供业务流程、核对规范和注意事项',sample:'每天进行固收数据核对时有哪些注意事项？',steps:['检索岗位流程及规范','按执行顺序梳理流程','列出常见问题和核查点']},
{id:'report',name:'工作成果辅助生成',emoji:'▧',cmd:'/生成报告',desc:'根据数据和模板组织分析报告初稿',sample:'帮我整理一份每日组合分析报告初稿。',steps:['确认报告目标及字段','组织已知数据及分析框架','生成可人工复核的初稿']},
{id:'review',name:'实战学习与复盘',emoji:'🎓',cmd:'/案例复盘',desc:'结合真实业务案例学习分析方法',sample:'用一个债券久期案例带我练习并复盘。',steps:['匹配学习主题和案例','给出情境与练习问题','解释标准分析思路及复盘要点']}
];
const questions=['我刚入职，今天应该做什么？','用实际例子解释 DV01','查询组合 A 最近三天的收益','如何判断组合收益异常？'];
const initSessions=[{id:1,title:'新人每日工作指引',messages:[]},{id:2,title:'DV01 指标学习',messages:[]}];
let sessions=initSessions,sessionId=1,view='chat',selected=[],enabled=Object.fromEntries(SKILLS.map(s=>[s.id,true])),checked={},serial=3;
const el=id=>document.getElementById(id);const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeStorage(){try{let obj=JSON.parse(localStorage.getItem('zhixing_demo_v2'));if(obj&&Array.isArray(obj.sessions)){sessions=obj.sessions;sessionId=obj.sessionId;enabled={...enabled,...obj.enabled};checked=obj.checked||{};serial=obj.serial||3;if(!sessions.some(s=>s.id===sessionId))sessionId=sessions[0]?.id}}catch(e){}}
function persist(){try{localStorage.setItem('zhixing_demo_v2',JSON.stringify({sessions,sessionId,enabled,checked,serial}))}catch(e){}}
function current(){return sessions.find(s=>s.id===sessionId)||sessions[0]}
function toast(msg){let n=el('toast');n.textContent=msg;n.classList.add('show');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>n.classList.remove('show'),2300)}
function renderSessions(){let q=el('search').value.trim().toLowerCase();el('sessions').innerHTML=sessions.filter(s=>s.title.toLowerCase().includes(q)).map(s=>`<button class="session ${s.id===sessionId?'active':''}" data-session="${s.id}"><strong>${escapeHtml(s.title)}</strong><span>${s.messages.length?`${s.messages.length} 条消息`:'尚未开始'}</span></button>`).join('')||'<div class="empty">没有匹配的对话</div>';el('sessions').querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{sessionId=+b.dataset.session;view='chat';selected=[];render();persist()})}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={chat:['固收业务智能导师','岗位带教 · 工作辅助 · 可调用 Skills'],skills:['Skills 技能中心','启用、停用、选择和体验岗位技能'],tasks:['岗位工作指引','用任务清单辅助新员工开展工作'],knowledge:['岗位知识中心','业务基础知识与系统操作资料'],about:['关于工作空间','客户需求讨论阶段 · 非正式产品范围']};el('topTitle').textContent=titles[view][0];el('topSub').textContent=titles[view][1];el('composerArea').style.display=view==='chat'?'':'none';el('skillPicker').classList.remove('show');renderSessions();renderMain();renderSelected()}
function home(){return `<div class="inside"><div class="hero"><div class="hero-mark">知</div><div><h1>你好，我是固收业务智能导师</h1><p>遇到不懂的问题，我可以教你，也可以调用 Skills 帮你完成工作。</p></div></div><div class="demo">这是业务需求验证原型。技能调用、数据表格及执行记录均为本地模拟，不会访问真实业务系统。</div><h3>从一项工作开始</h3><div class="grid">${SKILLS.map(s=>`<button class="card" data-quick="${s.id}"><div class="emoji">${s.emoji}</div><strong>${s.name}</strong><small>${s.desc}</small></button>`).join('')}</div><div class="columns"><div class="panel"><h3>新人工作清单</h3>${['学习今日岗位任务','理解常用固收指标','熟悉组合持仓查询','完成一项数据分析练习'].map((t,i)=>`<div class="task"><input type="checkbox" ${checked[i]?'checked':''} data-check="${i}" id="check${i}"><label for="check${i}">${t}</label></div>`).join('')}<button class="link" data-goto="tasks">查看完整指引 →</button></div><div class="panel"><h3>Skills 工作方式</h3><div class="hint">在聊天框点击 <b>✧ Skills</b>，选择技能，然后提问即可看到模拟的执行过程与结果。</div><div class="chips" style="margin-top:14px">${SKILLS.slice(0,4).map(s=>`<button class="chip" data-quick="${s.id}">${s.emoji} ${s.name}</button>`).join('')}</div><p class="small-mark">也可以直接输入 / 调出技能选择菜单</p></div></div></div>`}
function chatHtml(){return `<div class="inside chat">${current().messages.map((m,i)=>m.role==='user'?`<div class="message user">${escapeHtml(m.text)}${m.skillNames?.length?`<div class="small-mark">调用：${m.skillNames.map(escapeHtml).join('、')}</div>`:''}</div>`:`<div class="message assistant"><div class="role"><span class="mini">知</span> 固收业务智能导师</div>${m.body}</div>`).join('')}</div>`}
function skillsPage(){return `<div class="inside"><h1 class="page-title">Skills 技能中心</h1><p class="page-intro">将岗位工作能力封装为可选择、可调用的技能。下面为八项演示技能，可启用、停用或从这里直接发起对话。</p><div class="subsection"><span class="pill">已启用 ${SKILLS.filter(s=>enabled[s.id]).length} / ${SKILLS.length} 项技能</span><span class="subhead">当前仅用于交互验证，不执行真实工具</span></div><div class="skill-list">${SKILLS.map(s=>`<div class="skill-card"><div class="skill-card-top"><div class="skill-icon">${s.emoji}</div><span class="pill" style="background:${enabled[s.id]?'#eaf2ff':'#f4f6f9'};color:${enabled[s.id]?'#3d76b6':'#9aa7b8'}">${enabled[s.id]?'已启用':'已停用'}</span></div><h3>${s.name}</h3><p>${s.desc}</p><div class="small-mark">指令 ${s.cmd}</div><div class="skill-actions"><button class="toggle ${enabled[s.id]?'':'off'}" data-toggle="${s.id}">${enabled[s.id]?'停用技能':'启用技能'}</button><button class="outline" data-detail="${s.id}">查看详情</button><button class="outline" data-try="${s.id}" ${enabled[s.id]?'':'disabled'}>在对话中使用 ↗</button></div></div>`).join('')}</div></div>`}
function tasksPage(){return `<div class="inside"><h1 class="page-title">岗位工作指引</h1><p class="page-intro">模拟新入职员工的学习任务。正式工作清单需与客户岗位 SOP 对齐。</p>${['明确岗位职责及每日工作顺序','学习久期、DV01 等风险指标','查询组合持仓及收益数据','对照案例进行指标变化分析','形成每日分析初稿并检查'].map((s,i)=>`<div class="panel" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:15px"><label style="display:flex;align-items:center;gap:12px"><input type="checkbox" data-check="${i+10}" ${checked[i+10]?'checked':''}><span>${s}</span></label><button class="outline" data-prompt="请分步骤指导我：${s}">开始指导</button></div>`).join('')}</div>`}
function knowledgePage(){return `<div class="inside"><h1 class="page-title">岗位知识中心</h1><p class="page-intro">下面是拟配置的资料分类；正式建设需提供客户内部已确认的文档与业务规则。</p>${[['📚','固收业务知识','专业名词、指标定义和计算口径'],['📋','岗位工作手册','每日/每周任务、岗位职责和工作流程'],['🧭','系统操作指南','业务系统菜单、截图和查询路径'],['🗂','历史案例库','典型分析报告、复盘案例和常见问题']].map((a,i)=>`<div class="panel" style="display:flex;align-items:center;gap:15px;margin:10px 0"><span style="font-size:24px">${a[0]}</span><div style="flex:1"><strong>${a[1]}</strong><div class="hint">${a[2]}</div></div><button class="outline" data-prompt="请介绍${a[1]}相关内容，并说明新人应该先学什么。">询问数字员工</button></div>`).join('')}</div>`}
function aboutPage(){return `<div class="inside"><h1 class="page-title">工作空间 · 原型说明</h1><p class="page-intro">采用独立的金融办公视觉语言：自然白、浅蓝和稳重深蓝，突出清晰易读，不沿用原系统配色。</p><div class="panel"><div class="detail"><strong>用途</strong>客户二次沟通、业务能力确认与交互演示</div><div class="detail"><strong>技能中心</strong>8项 Skills，可启用、停用、查看详情和在聊天中调用</div><div class="detail"><strong>对话交互</strong>技能选择器、/ 指令、执行步骤、模拟结果与来源说明</div><div class="detail"><strong>当前状态</strong>纯 HTML / CSS / JS 单文件，离线可运行</div><div class="detail"><strong>未接入</strong>大模型、LiveData、MCP、Runtime OS、企业账号及真实数据权限</div><div class="detail"><strong>业务边界</strong>数字员工主要作为新员工岗位带教和日常工作辅助；最终范围需客户确认</div></div></div>`}
function renderMain(){el('main').innerHTML=view==='chat'?(current().messages.length?chatHtml():home()):view==='skills'?skillsPage():view==='tasks'?tasksPage():view==='knowledge'?knowledgePage():aboutPage();bindMain();if(view==='chat'&&current().messages.length)el('main').scrollTop=el('main').scrollHeight}
function bindMain(){el('main').querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>startSkill(b.dataset.quick));el('main').querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>startSkill(b.dataset.try));el('main').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let id=b.dataset.toggle;enabled[id]=!enabled[id];selected=selected.filter(x=>x!==id);persist();render();toast(enabled[id]?'技能已启用':'技能已停用')});el('main').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));el('main').querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{checked[b.dataset.check]=b.checked;persist()});el('main').querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{view=b.dataset.goto;render()});el('main').querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{view='chat';render();send(b.dataset.prompt)})}
function showDetail(id){let s=SKILLS.find(t=>t.id===id);modal(s.emoji+' '+s.name,`<p>${s.desc}</p><div class="detail"><strong>快速指令</strong>${s.cmd}</div><div class="detail"><strong>示例问题</strong>${s.sample}</div><div class="detail"><strong>执行步骤</strong>${s.steps.map((x,i)=>`${i+1}. ${x}`).join('<br>')}</div><p class="demo">技能执行均为本地模拟；正式接入需校验数据权限与业务口径。</p>`)}
function startSkill(id){if(!enabled[id]){toast('该技能未启用，请先到 Skills 中心启用');return}view='chat';if(!selected.includes(id))selected.push(id);render();el('prompt').value=SKILLS.find(s=>s.id===id).sample;el('prompt').focus();toast('已选择技能，发送消息即可模拟调用')}
function renderSelected(){el('selectedSkills').innerHTML=selected.map(id=>{let s=SKILLS.find(s=>s.id===id);return `<div class="skill-chip">✧ ${s.name}<button title="移除技能" data-remove="${id}">×</button></div>`}).join('');el('selectedSkills').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected=selected.filter(id=>id!==b.dataset.remove);renderSelected()})}
function openPicker(search=''){let q=search.trim().toLowerCase();el('skillPicker').innerHTML=`<div class="picker-head"><strong>✧ 选择 Skills</strong><button class="head-btn" id="pickerClose">关闭</button></div><div class="subhead">点击添加技能；再次点击取消选择。停用技能不能调用。</div>${SKILLS.filter(s=>!q||s.name.toLowerCase().includes(q)||s.cmd.toLowerCase().includes(q)||s.desc.toLowerCase().includes(q)).map(s=>`<button class="picker-item" data-pick="${s.id}" ${enabled[s.id]?'':'disabled'}><div><strong class="${enabled[s.id]?'':'disabled-text'}">${s.emoji} ${s.name}</strong><small>${s.cmd} · ${s.desc}</small></div><span>${!enabled[s.id]?'未启用':selected.includes(s.id)?'✓ 已选择':'＋ 添加'}</span></button>`).join('')||'<div class="empty">没有匹配技能</div>'}`;el('skillPicker').classList.add('show');el('pickerClose').onclick=()=>el('skillPicker').classList.remove('show');el('skillPicker').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let id=b.dataset.pick;selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];renderSelected();openPicker(q)})}
function resultFor(id,q){let note='<div class="source">数据说明：本地演示示例，不代表已查询真实系统。正式环境需展示真实来源、业务日期、接口和权限校验结果。</div>';if(id==='knowledge')return `<p><b>DV01</b>（Dollar Value of 1 Basis Point）用于衡量利率变动一个基点（0.01个百分点）时，债券或组合价值的近似变化金额。</p><p>新人可以先理解为：<b>“利率小幅变动时，组合对它有多敏感？”</b> 数值的正负和金额口径应以本单位指标定义为准。</p><p>例如：如果某持仓 DV01 的绝对值为 2 万元，那么在其他条件基本不变时，相关收益率变化 1bp，价值变化量的绝对值约为 2 万元，方向需要结合指标符号约定判断。</p>${note}`;
if(id==='guide')return `<p>下面是<b>供确认的岗位工作顺序示例</b>，并非客户已确定的流程：</p><ol><li>查看当天岗位任务与业务通知。</li><li>核对需要关注的组合和数据更新时间。</li><li>查询持仓、收益、久期等常用指标。</li><li>记录异常变化并请业务负责人确认。</li><li>整理当天的数据或分析工作成果。</li></ol><p>请客户补充实际岗位和 SOP 后，再将其配置为标准指引。</p>${note}`;
if(id==='operation')return `<p>系统操作示例：先确认目标组合和业务日期，再进入对应业务系统的组合查询功能，选择持仓明细，并核对组合编号、证券代码、数量、市值及业务时点。</p><p><b>具体菜单名称、位置及字段含义</b>必须以客户提供的操作手册和系统页面为准，原型不虚构实际菜单路径。</p>${note}`;
if(id==='data')return `<p>已按“组合 A / 近三日 / 收益与风险指标”生成<b>模拟查询结果</b>：</p><div class="result"><table><thead><tr><th>日期</th><th>组合收益率（示例）</th><th>修正久期（示例）</th></tr></thead><tbody><tr><td>第 1 日</td><td>0.08%</td><td>3.42</td></tr><tr><td>第 2 日</td><td>0.05%</td><td>3.45</td></tr><tr><td>第 3 日</td><td>-0.02%</td><td>3.51</td></tr></tbody></table></div><p>下一步可以分析收益变化是否与久期、市场利率或估值变化相关，但不能仅由此表确定原因。</p>${note}`;
if(id==='analysis')return `<p><b>建议按以下顺序排查：</b></p><ol><li>核实收益下降发生的业务日期与计算口径。</li><li>对比组合持仓、交易及现金流变化。</li><li>查看市场收益率、债券价格及信用利差的变化。</li><li>排查估值口径或源数据异常。</li><li>仅对有证据的因素形成初步结论，其他标记“待核实”。</li></ol>${note}`;
if(id==='process')return `<p><b>日常数据核对参考流程：</b>确认任务范围 → 查询数据 → 核查完整性与时间口径 → 对比异常 → 记录差异 → 提交人工复核。</p><p>注意：真实的异常阈值、数据回补方式、审批操作和责任边界需由客户 SOP 确认。</p>${note}`;
if(id==='report')return `<p><b>每日组合分析报告（初稿结构）</b></p><ol><li>报告日期与数据来源</li><li>持仓和结构变化</li><li>收益表现及同期对比</li><li>风险指标与异常事项</li><li>待核实问题及后续工作</li></ol><p>可在正式环境接入客户指定报告模板与数据服务。</p>${note}`;
return `<p><b>练习：</b>假设一只固定利率债券的市场到期收益率上升，在其他条件不变的情况下，价格通常如何变化？</p><p>参考解读：价格通常下降。接下来可以讨论修正久期较大的债券为什么对利率变化更敏感。</p><p>新人可尝试给出自己的解释，再对照业务规则进行复盘。</p>${note}`}
function infer(q){let x=q.toLowerCase();if(/dv01|术语|概念|什么是|久期是什么/.test(x))return 'knowledge';if(/新人|入职|每天|每周|岗位|工作清单/.test(x))return 'guide';if(/菜单|页面|系统|在哪|怎么操作/.test(x))return 'operation';if(/报告|总结|日报|周报/.test(x))return 'report';if(/复盘|练习|案例/.test(x))return 'review';if(/流程|规范|核对/.test(x))return 'process';if(/异常|下降|原因|解读|分析/.test(x))return 'analysis';if(/查询|查一下|持仓|收益|行情|数据/.test(x))return 'data';return 'knowledge'}
function send(raw){let v=String(raw??el('prompt').value).trim();if(!v)return;let explicit=null;for(let s of SKILLS){if(v.startsWith(s.cmd)){explicit=s.id;v=v.slice(s.cmd.length).trim()||s.sample;break}}let ids=[...selected];if(explicit&&enabled[explicit]&&!ids.includes(explicit))ids.unshift(explicit);if(!ids.length){let guess=infer(v);if(enabled[guess])ids=[guess]}if(!ids.length){toast('没有可用的 Skills，请先启用技能');return}let c=current();if(!c.messages.length)c.title=v.length>19?v.slice(0,19)+'…':v;c.messages.push({role:'user',text:v,skillNames:ids.map(id=>SKILLS.find(s=>s.id===id).name)});let sections=ids.map(id=>{let s=SKILLS.find(s=>s.id===id);return `<div class="execution"><div class="execution-head"><span>✧ ${s.emoji} ${s.name}</span><span>✓ 模拟完成</span></div>${s.steps.map((step,i)=>`<div class="execution-step">✓ 步骤 ${i+1} · ${escapeHtml(step)}</div>`).join('')}</div><div class="answer">${resultFor(id,v)}</div>`});let out=`<p class="muted">已根据你的工作问题执行 ${ids.length} 项 Skills（模拟）：</p>${sections.join('')}`;c.messages.push({role:'assistant',body:out});selected=[];el('prompt').value='';view='chat';render();persist()}
function modal(title,body){el('modalTitle').textContent=title;el('modalBody').innerHTML=body;el('modalBg').classList.add('show')}
function newChat(){sessions.unshift({id:serial++,title:'新对话',messages:[]});sessionId=sessions[0].id;selected=[];view='chat';render();persist();el('prompt').focus()}
function exportChat(){if(!current().messages.length){toast('当前对话尚无消息');return}let content=current().title+'\n本地模拟演示 · 非真实业务数据\n\n'+current().messages.map(m=>m.role==='user'?'用户：'+m.text+'\n使用技能：'+(m.skillNames||[]).join('、'):'数字员工：'+m.body.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ')).join('\n\n');let blob=new Blob([content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='数字员工Skills演示对话.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});el('newChat').onclick=newChat;el('search').oninput=renderSessions;el('send').onclick=()=>send();el('chooseSkills').onclick=()=>el('skillPicker').classList.contains('show')?el('skillPicker').classList.remove('show'):openPicker();el('prompt').oninput=()=>{let v=el('prompt').value;if(v.startsWith('/'))openPicker(v);else if(el('skillPicker').classList.contains('show'))el('skillPicker').classList.remove('show')};el('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}else if(e.key==='Escape')el('skillPicker').classList.remove('show')};el('export').onclick=exportChat;el('reset').onclick=()=>modal('重置演示数据',`<p>将恢复会话、Skills 启用状态和岗位勾选状态。</p><button class="send" id="confirmReset">确认重置</button>`);el('modalBg').addEventListener('click',e=>{if(e.target===el('modalBg'))el('modalBg').classList.remove('show');if(e.target.id==='confirmReset'){try{localStorage.removeItem('zhixing_demo_v2')}catch{}sessions=JSON.parse(JSON.stringify(initSessions));sessionId=1;selected=[];enabled=Object.fromEntries(SKILLS.map(s=>[s.id,true]));checked={};serial=3;el('modalBg').classList.remove('show');render();toast('已恢复演示数据')}});el('modalClose').onclick=()=>el('modalBg').classList.remove('show');document.addEventListener('keydown',e=>{if(e.key==='Escape')el('modalBg').classList.remove('show')});safeStorage();render();
</script>
</body></html>
